<style> 
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--yazi); background: var(--zemin); -webkit-font-smoothing: antialiased; }

a { color: inherit; }

.kap { max-width: 760px; margin: 0 auto; padding: 16px 16px 70px; }
.ust { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 10px; padding: 8px; margin-bottom: 16px; border-radius: var(--r-3); }
.ust-geri, .ust .tema-dugme { width: 42px !important; height: 42px !important; border-radius: var(--r-2)!important; display: grid; place-items: center; color: var(--yazi) !important;
  background: var(--kart) !important; border: 1px solid var(--cizgi) !important; box-shadow: var(--golge)!important; text-decoration: none; cursor: pointer; }
.ust-geri svg { width: 20px; height: 20px; } .ust .tema-dugme svg { width: 19px !important; height: 19px !important; }
.ust .tema-sag { display: contents; } .ust .tema-dugme { grid-column: 3; }
.ust .logo { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: 10px; text-decoration: none; }
.ust .logo span { display: flex; flex-direction: column; font-weight: 700; font-size: 16.5px; letter-spacing: -.3px; line-height: 1.1; }
.ust .logo small { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mavi); margin-top: 2px; }
.logo-ikon { width: 32px; height: 32px; border-radius: var(--r-1); }

.hero { position: relative; overflow: hidden; border-radius: var(--r-3); color: #fff; isolation: isolate; padding: 22px 20px 20px;
  background: linear-gradient(140deg, var(--sp1), var(--sp2)); box-shadow: var(--golge); }
.hero-kolaj { position: absolute; right: -24px; top: -18px; display: grid; grid-template-columns: repeat(2, 92px); gap: 10px; transform: rotate(10deg); opacity: .5; z-index: -1; }
.hero-kolaj img { width: 92px; height: 92px; border-radius: var(--r-3); object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--sp2) 30%, transparent 85%); opacity: .9; z-index: -1; }
.h-rozet { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 5px 10px; border-radius: var(--r-hap); background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); }
.h-rozet svg { width: 13px; height: 13px; }
.h-ust { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
.h-logo { width: 68px; height: 68px; border-radius: var(--r-3); object-fit: cover; border: 2.5px solid rgba(255,255,255,.6); box-shadow: var(--golge); flex: none; }
.hero h1 { margin: 0; font-size: 28px; letter-spacing: -.8px; line-height: 1.1; } .hero .tur { font-size: 13.5px; font-weight: 600; opacity: .88; margin-top: 4px; }
.hero p.slogan { margin: 14px 0 0; font-size: 14.5px; line-height: 1.55; opacity: .92; max-width: 420px; }
.h-bilgi { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.h-bilgi span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 7px 11px; border-radius: var(--r-2); background: rgba(0,0,0,.18); }
.h-bilgi svg { width: 15px; height: 15px; }
.eylem { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: var(--r-2); text-decoration: none; font: 700 15px var(--font); cursor: pointer;
  background: var(--kart); border: 1px solid var(--cizgi); color: var(--yazi); transition: transform .12s, filter .15s; }
.btn:active { transform: scale(.98); } .btn svg { width: 19px; height: 19px; }
.btn.ana { background: var(--sp1); border-color: var(--sp1); color: #fff; box-shadow: var(--golge); }
.sekme { display: flex; gap: 8px; overflow-x: auto; margin: 22px 0 12px; padding: 2px; scrollbar-width: none; position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 4; }
.sekme::-webkit-scrollbar { display: none; }
.sekme a { flex: none; padding: 10px 15px; border-radius: var(--r-2); background: var(--cam); border: 1px solid var(--cam-kenar); font-weight: 700; font-size: 14px; text-decoration: none; }
.sekme a.aktif { background: var(--yazi); color: #fff; border-color: var(--yazi); }
.kat h2 { font-size: 18px; letter-spacing: -.4px; margin: 22px 2px 12px; scroll-margin-top: 70px; }
.izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.urun { display: flex; flex-direction: column; border-radius: var(--r-3); overflow: hidden; background: var(--kart); border: 1px solid var(--cizgi); box-shadow: var(--golge); position: relative; }
.urun-resim { aspect-ratio: 1; background: #2a130f; overflow: hidden; } .urun-resim img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.urun-one { position: absolute; top: 10px; left: 10px; font-size: 10.5px; font-weight: 700; padding: 4px 8px; border-radius: var(--r-hap); background: #ffd27a; color: #5a3a00; }
.urun-ic { padding: 12px 12px 12px; display: flex; flex-direction: column; flex: 1; }
.urun b { font-size: 15px; letter-spacing: -.2px; } .urun small { display: block; color: var(--soluk); font-size: 12.5px; line-height: 1.45; margin: 3px 0 10px; font-weight: 600; }
.urun-alt { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.fiyat { font-size: 16px; font-weight: 700; color: var(--sp1); letter-spacing: -.3px; }
.urun-ara { width: 36px; height: 36px; border-radius: var(--r-2); display: grid; place-items: center; background: var(--sp1); color: #fff; flex: none; }
.urun-ara svg { width: 17px; height: 17px; }
.bilgi-kart { margin-top: 24px; padding: 6px 16px; }
.bilgi-kart div { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-top: 1px solid var(--cizgi); font-size: 14px; font-weight: 600; }
.bilgi-kart div:first-child { border-top: 0; } .bilgi-kart svg { width: 20px; height: 20px; color: var(--sp1); flex: none; } .bilgi-kart a { text-decoration: none; }
.not { color: var(--soluk); font-size: 12.5px; text-align: center; margin: 18px 10px 0; line-height: 1.5; }
.lst-bas { margin: 6px 2px 18px; } .lst-bas h1 { margin: 10px 0 6px; font-size: 30px; letter-spacing: -.9px; } .lst-bas p { margin: 0; color: var(--soluk); font-size: 14.5px; line-height: 1.55; max-width: 520px; }
.lst-et { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--mavi); background: var(--mavi-acik); padding: 5px 10px; border-radius: var(--r-hap); }
.lst-et svg { width: 13px; height: 13px; }
.lst { display: grid; gap: 14px; }
.lst-kart { position: relative; overflow: hidden; isolation: isolate; display: block; border-radius: var(--r-3); text-decoration: none; color: #fff; background: linear-gradient(135deg, var(--sp1), var(--sp2)); box-shadow: var(--golge); transition: transform .15s; }
.lst-kart:active { transform: scale(.985); }
.lst-kart::after { content: ""; position: absolute; right: -60px; top: -80px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.22), transparent); z-index: -1; }
.lst-ust { display: flex; gap: 14px; align-items: center; padding: 18px 18px 14px; }
.lst-logo { width: 64px; height: 64px; border-radius: var(--r-3); object-fit: cover; border: 2.5px solid rgba(255,255,255,.55); flex: none; }
.lst-r { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-hap); background: rgba(255,255,255,.2); }
.lst-ust b { display: block; font-size: 22px; letter-spacing: -.5px; margin-top: 4px; } .lst-ust small { font-size: 13px; opacity: .88; font-weight: 600; }
.lst-urun { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 18px; }
.lst-urun img { width: 100%; aspect-ratio: 1; border-radius: var(--r-2); object-fit: cover; border: 1.5px solid rgba(255,255,255,.3); }
.lst-alt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 18px; }
.lst-alt span { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 700; opacity: .9; min-width: 0; } .lst-alt span svg { width: 15px; height: 15px; flex: none; }
.lst-alt em { flex: none; display: inline-flex; align-items: center; gap: 6px; font-style: normal; padding: 11px 15px; border-radius: var(--r-2); background: #fff; color: var(--sp1); font-weight: 700; font-size: 14px; }
.lst-alt em svg { width: 16px; height: 16px; }
.lst-bos { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-3); text-decoration: none; border: 1.5px dashed rgba(20,27,52,.16); background: rgba(255,255,255,.5); }
.lst-bos > span { display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-2); background: var(--mavi-acik); color: var(--mavi); flex: none; } .lst-bos > span svg { width: 24px; height: 24px; }
.lst-bos div { flex: 1; } .lst-bos b { display: block; font-size: 15px; } .lst-bos small { color: var(--soluk); font-size: 12.5px; }
.lst-bos em { font-style: normal; font-weight: 700; font-size: 13px; color: var(--mavi); white-space: nowrap; }
html[data-tema="koyu"] .lst-bos { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.14); }
@media (min-width: 820px) { .lst { grid-template-columns: 1fr 1fr; } .lst-bos { grid-column: 1 / -1; } .lst-kart:hover { transform: translateY(-3px); } }

.alt-bilgi { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin-top: 36px; font-size: 13px; color: var(--soluk); }
@media (min-width: 640px) { .izgara { grid-template-columns: repeat(3, 1fr); } .hero { padding: 30px 30px 28px; } .hero h1 { font-size: 34px; } .hero-kolaj { grid-template-columns: repeat(3, 110px); } .hero-kolaj img { width: 110px; height: 110px; } }
@media (min-width: 980px) { .kap { max-width: 1040px; padding: 24px 32px 80px; } .urun:hover .urun-resim img { transform: scale(1.05); } .btn:hover { filter: brightness(1.05); } }
html[data-tema="koyu"] { --kart: #1a2034; }
html[data-tema="koyu"] .sekme a.aktif { background: #e7eaf6; color: #141b34; }

<body>

<div class="kap">
  <header class="ust cam">
    <a class="ust-geri" href="index.html" onclick="if(history.length>1&&document.referrer.indexOf(location.host)>-1){history.back();return false}" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="logo" href="index.html"><img class="logo-ikon" src="/ikonlar/logo-128.png" alt="" width="32" height="32"><span>KampüsCepte<small>Sponsorlarımız</small></span></a>
  </header>
  <main id="magaza"></main>
  <footer class="alt-bilgi"><a href="index.html">Ana sayfa</a><a href="/sponsor/">Sponsor ol</a><a href="gizlilik.html">Gizlilik</a></footer>
</div>
<script src="/sponsorlar.js?v=1"></script>
<script>
(function () {
  var M = document.getElementById("magaza"), L = window.SPONSORLAR || [];
  var I = {
    tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    konum: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    yildiz: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
    dukkan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 13v8h14v-8"/></svg>'
  };
  var id = new URLSearchParams(location.search).get("s"), s = L.filter(function (x) { return x.id === id; })[0];
  function harita(x) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(x.harita || x.ad + " Elazığ"); }
  if (!s) {
    document.title = "Sponsorlarımız – KampüsCepte";
    var ok = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    M.innerHTML = '<section class="lst-bas"><span class="lst-et">' + I.yildiz + 'Öğrencilere yakın işletmeler</span><h1>Sponsorlarımız</h1><p>KampüsCepte\'yi ücretsiz tutmamıza destek olan işletmeler. Menülerini, fiyatlarını gez; tek dokunuşla ara.</p></section>' +
      '<div class="lst">' + L.map(function (x) {
        var u = [].concat.apply([], x.kategoriler.map(function (k) { return k.urunler; }));
        return '<a class="lst-kart" style="--sp1:' + x.renk[0] + ';--sp2:' + x.renk[1] + '" href="magaza.html?s=' + x.id + '">' +
          '<div class="lst-ust"><img class="lst-logo" src="' + x.logo + '" alt=""><div><span class="lst-r">Sponsor</span><b>' + x.ad + '</b><small>' + x.tur + '</small></div></div>' +
          '<div class="lst-urun">' + u.slice(0, 4).map(function (y) { return '<img src="' + y.resim + '" alt="" loading="lazy">'; }).join("") + '</div>' +
          '<div class="lst-alt"><span>' + I.konum + x.konum.split(",")[0] + '</span><em>Mağazayı gez' + ok + '</em></div></a>';
      }).join("") +
      '<a class="lst-bos" href="/sponsor/"><span>' + I.dukkan + '</span><div><b>İşletmeni burada gör</b><small>Öğrencilerin her gün baktığı uygulamada yerini al.</small></div><em>Bilgi al ›</em></a></div>';
    return;
  }
  document.title = s.ad + " – KampüsCepte Sponsoru";
  document.documentElement.style.setProperty("--sp1", s.renk[0]); document.documentElement.style.setProperty("--sp2", s.renk[1]);
  var tum = [].concat.apply([], s.kategoriler.map(function (k) { return k.urunler; }));
  var h = '<section class="hero"><div class="hero-kolaj">' + tum.slice(0, 6).map(function (u) { return '<img src="' + u.resim + '" alt="">'; }).join("") + "</div>" +
    '<span class="h-rozet">' + I.yildiz + "KampüsCepte sponsoru</span>" +
    '<div class="h-ust"><img class="h-logo" src="' + s.logo + '" alt=""><div><h1>' + s.ad + '</h1><div class="tur">' + s.tur + "</div></div></div>" +
    '<p class="slogan">' + s.slogan + "</p>" +
    '<div class="h-bilgi"><span>' + I.konum + s.konum.split(",")[0] + "</span><span>" + I.dukkan + tum.length + " ürün</span></div></section>";
  h += '<div class="eylem"><a class="btn ana" href="tel:' + s.tel + '">' + I.tel + 'Ara, sipariş ver</a><a class="btn" href="' + harita(s) + '" target="_blank" rel="noopener">' + I.konum + "Yol tarifi</a></div>";
  if (s.kategoriler.length > 1) h += '<nav class="sekme">' + s.kategoriler.map(function (k, i) { return '<a href="#k' + i + '" class="' + (i ? "" : "aktif") + '">' + k.ad + "</a>"; }).join("") + "</nav>";
  h += s.kategoriler.map(function (k, i) {
    return '<section class="kat"><h2 id="k' + i + '">' + k.ad + '</h2><div class="izgara">' + k.urunler.map(function (u) {
      return '<div class="urun"><div class="urun-resim"><img src="' + u.resim + '" alt="' + u.ad + '" loading="lazy"></div>' + (u.one ? '<span class="urun-one">' + u.one + "</span>" : "") +
        '<div class="urun-ic"><b>' + u.ad + "</b><small>" + u.icerik + '</small><div class="urun-alt"><span class="fiyat">' + u.fiyat + '</span><a class="urun-ara" href="tel:' + s.tel + '" aria-label="' + u.ad + ' için ara">' + I.tel + "</a></div></div></div>";
    }).join("") + "</div></section>";
  }).join("");
  h += '<div class="bilgi-kart cam"><div>' + I.konum + '<a href="' + harita(s) + '" target="_blank" rel="noopener">' + s.konum + "</a></div><div>" + I.tel + '<a href="tel:' + s.tel + '">' + s.telYaz + "</a></div></div>";
  h += '<p class="not">Fiyatlar işletme tarafından bildirilmiştir; güncel fiyat için işletmeyi arayabilirsin.</p>';
  M.innerHTML = h;
  /* kaydırınca aktif kategori */
  var sk = M.querySelectorAll(".sekme a");
  if (sk.length) addEventListener("scroll", function () {
    var aktif = 0; s.kategoriler.forEach(function (_, i) { var e = document.getElementById("k" + i); if (e.getBoundingClientRect().top < 140) aktif = i; });
    sk.forEach(function (a, i) { a.classList.toggle("aktif", i === aktif); });
  }, { passive: true });
  try { gtag("event", "sponsor_magaza", { sponsor: s.id }); } catch (e) {}
})();
</script>
