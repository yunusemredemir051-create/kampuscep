# Üniversite Evi haftalık menüsünü unievi.firat.edu.tr'den okuyup veri.js'e yazar (bkz. ARAYUZ-PLANI.md Ek 2).
# Üniversite sitesi yurt dışından gelen bağlantılara cevap vermiyor; bu yüzden sayfa, depo ayarlarındaki
# Cloudflare Worker (workers/kc-unievi.js) üzerinden de denenir. Worker adresi gizli değildir; istenirse depo ayarlarındaki
# UNIEVI_VEKIL_URL değişkeniyle değiştirilebilir.
name: Üniversite Evi menüsü

on:
  workflow_dispatch:
  push:   # GEÇİCİ: yurt dışından aracı testi için, birleştirmeden önce kaldırılacak
    branches: [menu/unievi-otomatik]
    paths: [.github/**, workers/**]
  schedule:
    # Menü cumartesi, pazar ya da pazartesi açıklanıyor: bu günlerde 08:23–22:23 (TR) arası 2 saatte bir.
    # O haftanın menüsü tamamlanınca betik siteye hiç gitmeden çıkar.
    - cron: "23 5-19/2 * * 6,0,1"
    # Salı–cuma günde bir kez (07:17 TR): sitede sonradan yapılan düzeltmeleri yakalar.
    - cron: "17 4 * * 2-5"

permissions:
  contents: write

concurrency: unievi

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Okuyucunun testleri
        run: python3 -m unittest discover -s .github/scripts/test
      - name: Menüyü oku ve veri.js'i güncelle
        env:
          UNIEVI_VEKIL_URL: ${{ vars.UNIEVI_VEKIL_URL || 'https://kc-unievi.yunusemredemir051.workers.dev/' }}
          UNIEVI_MOD: ${{ github.event.schedule == '23 5-19/2 * * 6,0,1' && 'haftasonu' || 'gunluk' }}
        run: python3 .github/scripts/unievi_guncelle.py
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet veri.js; then echo "Menü değişmemiş."; exit 0; fi
          git config user.name "kampuscepte-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add veri.js
          git commit -m "Üniversite Evi menüsü güncellendi (otomatik)"
          git pull --rebase -q && git push
      - name: Kaydı "unievi-kayit" dalına koy
        if: always()
        run: |
          mkdir -p /tmp/kayit && cp -f /tmp/unievi.html /tmp/unievi.log /tmp/kayit/ 2>/dev/null || true
          cd /tmp/kayit
          git init -q -b unievi-kayit
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "kayıt ${{ github.run_number }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" unievi-kayit
