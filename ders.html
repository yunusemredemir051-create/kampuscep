<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eef3ff">
<title>Ders Notları – KampüsCepte</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Ünite ünite ders notları ve sitede çözülebilen Kendini Test Et soruları.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --zemin: #eef3ff;
  --cam: rgba(255, 255, 255, .72);
  --cam-guclu: rgba(255, 255, 255, .92);
  --cam-kenar: rgba(255, 255, 255, .9);
  --golge: 0 10px 30px -12px rgba(40, 60, 140, .18);
  --mavi: #3b5bfd; --mavi-acik: #e6ebff;
  --turuncu: #ff8a3d; --turuncu-acik: #fff0e5;
  --yesil: #16b67a; --yesil-acik: #e2f8ee;
  --pembe: #f2557f; --pembe-acik: #ffe8ee;
  --mor: #8b5cf6; --mor-acik: #f0e9ff;
  --yazi: #141b34; --soluk: #6b7390; --cizgi: #e6e9f4;
  --font: "Plus Jakarta Sans", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--yazi); background: var(--zemin); -webkit-font-smoothing: antialiased; }
.isik { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(520px 380px at 90% 0%, rgba(255, 170, 110, .45), transparent 70%),
    radial-gradient(600px 460px at -5% 25%, rgba(120, 150, 255, .40), transparent 70%),
    radial-gradient(520px 420px at 80% 100%, rgba(90, 220, 170, .30), transparent 70%),
    var(--zemin); }
:focus-visible { outline: 2px solid var(--mavi); outline-offset: 3px; }
a { color: inherit; }
.cam { background: var(--cam); border: 1px solid var(--cam-kenar); border-radius: 22px; box-shadow: var(--golge);
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); }
.kap { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; }

.ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-bottom: 22px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; text-decoration: none; }
.logo-ikon { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(140deg, var(--mavi), var(--mor)); color: #fff; font-size: 15px; }
.geri { border: 0; background: none; color: var(--mavi); font: 700 14px var(--font); cursor: pointer; padding: 6px 4px; text-decoration: none; display: inline-block; }

.ust-bilgi small { color: var(--soluk); font-weight: 700; font-size: 13px; }
.ust-bilgi h1 { margin: 4px 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -.8px; line-height: 1.15; }
.ust-bilgi p { margin: 0; color: var(--soluk); font-size: 15px; line-height: 1.55; }
.yazar { font-weight: 700; color: var(--yazi) !important; font-size: 14px !important; margin-top: 6px !important; }
.ozet { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.ozet span { font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid var(--cam-kenar); }
.butonlar { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 14px; cursor: pointer;
  font: 700 14px var(--font); border: 1px solid var(--cizgi); background: #fff; color: var(--yazi); text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.ana { background: var(--mavi); color: #fff; border-color: var(--mavi); }
.btn:hover { filter: brightness(1.04); }
.btn[disabled] { opacity: .4; cursor: default; }

/* Ünite kartları */
.baslik { font-size: 17px; font-weight: 800; margin: 26px 0 12px; }
.uniteler { display: grid; gap: 12px; }
.unite { padding: 16px; }
.unite-ust { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.no { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 13px; line-height: 1.1; text-align: center; }
.no b { display: block; font-size: 18px; }
.no.c0 { background: var(--mavi-acik); color: var(--mavi); } .no.c1 { background: var(--turuncu-acik); color: var(--turuncu); }
.no.c2 { background: var(--yesil-acik); color: var(--yesil); } .no.c3 { background: var(--pembe-acik); color: var(--pembe); }
.no.c4 { background: var(--mor-acik); color: var(--mor); }
.unite h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; line-height: 1.3; }
.meta { color: var(--soluk); font-size: 13px; font-weight: 600; margin-top: 3px; }
.ilerleme { height: 6px; border-radius: 99px; background: rgba(20,27,52,.07); overflow: hidden; margin: -4px 0 14px; }
.ilerleme div { height: 100%; background: linear-gradient(90deg, var(--yesil), #3fd6a0); border-radius: 99px; }
.unite .butonlar .btn { flex: 1; min-width: 130px; }

/* Test */
.sekmeler { display: flex; gap: 6px; background: rgba(20,27,52,.05); border-radius: 14px; padding: 4px; margin: 16px 0 12px; }
.sekmeler button { flex: 1; white-space: nowrap; border: 0; background: transparent; color: var(--soluk); font: 700 13px var(--font); padding: 10px 8px; border-radius: 11px; cursor: pointer; }
.sekmeler button.aktif { background: #fff; color: var(--yazi); box-shadow: 0 2px 8px rgba(20,27,52,.08); }
.sekmeler .kisa { display: none; }
.skor { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; margin: 0 2px 10px; flex-wrap: wrap; }
.skor .d { color: var(--yesil); } .skor .y { color: var(--pembe); } .skor .k { color: var(--soluk); }
.skor .ara { flex: 1; }
.skor button { border: 0; background: none; color: var(--mavi); font: 700 13px var(--font); cursor: pointer; padding: 0; }
.not-kutu { padding: 12px 14px; border-radius: 14px; background: var(--turuncu-acik); color: #9a4a12; font-size: 13px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }

.noktalar { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 12px; }
.noktalar button { width: 30px; height: 30px; border-radius: 9px; border: 1.5px solid var(--cizgi); background: #fff; color: var(--soluk); font: 800 12px var(--font); cursor: pointer; padding: 0; }
.noktalar button.dogru { background: var(--yesil); border-color: var(--yesil); color: #fff; }
.noktalar button.yanlis { background: var(--pembe); border-color: var(--pembe); color: #fff; }
.noktalar button.su-an { border-color: var(--mavi); box-shadow: 0 0 0 2px rgba(59,91,253,.25); color: var(--mavi); }
.noktalar button.su-an.dogru, .noktalar button.su-an.yanlis { color: #fff; }

.havuz { padding: 14px; margin-bottom: 12px; }
.havuz-baslik { font-size: 12px; font-weight: 800; color: var(--soluk); margin-bottom: 10px; }
.kelimeler { display: flex; flex-wrap: wrap; gap: 7px; }
.kelime { border: 1.5px solid #c9d3fb; background: #fff; color: var(--mavi); font: 700 13px var(--font); padding: 7px 11px; border-radius: 10px; cursor: pointer; }
.kelime:hover { background: var(--mavi-acik); }
.kelime.kullanildi { opacity: .35; text-decoration: line-through; border-style: dashed; }

.soru { padding: 20px; min-height: 260px; }
.soru-no { font-size: 12px; font-weight: 800; color: var(--mavi); margin-bottom: 8px; }
.soru-metin { font-size: 17px; font-weight: 600; line-height: 1.65; }
.siklar { display: grid; gap: 8px; margin-top: 16px; }
.sik { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px;
  border: 1.5px solid var(--cizgi); background: #fff; font: 600 15px/1.45 var(--font); color: var(--yazi); cursor: pointer; }
.sik:hover:not([disabled]) { border-color: #b8c3f5; }
.sik .harf { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; background: rgba(20,27,52,.06); font-size: 13px; font-weight: 800; }
.sik[disabled] { cursor: default; }
.sik.dogru { border-color: var(--yesil); background: var(--yesil-acik); }
.sik.dogru .harf { background: var(--yesil); color: #fff; }
.sik.yanlis { border-color: var(--pembe); background: var(--pembe-acik); }
.sik.yanlis .harf { background: var(--pembe); color: #fff; }
.dy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.dy .sik { justify-content: center; font-weight: 800; }
.aciklama { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; font-weight: 500; }
.aciklama.iyi { background: var(--yesil-acik); color: #0c6e4b; }
.aciklama.kotu { background: var(--pembe-acik); color: #a3264a; }
.aciklama b { font-weight: 800; }
.bosluk-giris { display: inline-block; max-width: 100%; margin: 2px 4px; padding: 6px 10px; border: 0; border-bottom: 2px solid #b8c3f5;
  background: rgba(59,91,253,.06); border-radius: 8px 8px 0 0; font: 700 15px var(--font); color: var(--mavi); vertical-align: baseline; }
.bosluk-giris:focus { outline: none; border-bottom-color: var(--mavi); background: rgba(59,91,253,.12); }
.bosluk-giris.dogru { border-bottom-color: var(--yesil); color: var(--yesil); background: var(--yesil-acik); }
.bosluk-giris.yanlis { border-bottom-color: var(--pembe); color: var(--pembe); background: var(--pembe-acik); }
.soru .butonlar { margin-top: 16px; }
.ust-cizgi { text-decoration: overline; text-decoration-thickness: 1.5px; }
sub { font-size: .7em; }
.gezinme { display: flex; gap: 10px; margin-top: 12px; }
.gezinme .btn { flex: 1; }

.sonuc { padding: 26px; text-align: center; }
.sonuc .buyuk { font-size: 54px; font-weight: 800; letter-spacing: -2px; color: var(--mavi); line-height: 1.1; }
.sonuc p { color: var(--soluk); margin: 6px 0 18px; font-weight: 600; }
.sonuc .satirlar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.sonuc .satirlar div { background: rgba(20,27,52,.04); border-radius: 12px; padding: 10px 6px; font-size: 12px; font-weight: 700; color: var(--soluk); }
.sonuc .satirlar b { display: block; font-size: 18px; color: var(--yazi); }
.sonuc .butonlar { justify-content: center; }

.vitrin { margin: 18px 0; min-height: 100px; display: grid; place-items: center; border: 1.5px dashed #c9d1ec; border-radius: 18px; color: var(--soluk); font-size: 12px; background: rgba(255,255,255,.35); }
.hata { padding: 28px; text-align: center; color: var(--soluk); font-weight: 600; }
.alt-bilgi { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin: 40px 0 0; font-size: 13px; color: var(--soluk); }
.alt-bilgi a { color: var(--soluk); font-weight: 600; }

@media (max-width: 600px) {
  .ust-bilgi h1 { font-size: 24px; }
  .soru-metin { font-size: 16px; }
  .soru { padding: 18px 16px; }
  .sekmeler .uzun { display: none; } .sekmeler .kisa { display: inline; }
}

/* ===================== Prova / deneme ===================== */
.pv-kartlar { display: grid; gap: 12px; margin-bottom: 22px; }
.ls-sekme { margin: 4px 0 14px; }
.ls-sekme button { display: flex; align-items: center; justify-content: center; gap: 7px; }
.ls-sekme button i { font-style: normal; font-size: 11.5px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: rgba(20,27,52,.08); }
.ls-sekme button.aktif i { background: rgba(255,255,255,.25); }
.pv-kart { padding: 16px; display: grid; gap: 12px; }
.pv-kart-ust { display: flex; gap: 14px; align-items: center; }
.pv-ikon { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; background: linear-gradient(140deg, var(--mavi), var(--mor)); color: #fff; }
.pv-ikon.vize { background: linear-gradient(140deg, #3b5bfd, #6a82ff); } .pv-ikon.final { background: linear-gradient(140deg, #f2557f, #ff8a3d); } .pv-ikon.karma { background: linear-gradient(140deg, #16b67a, #3fd6a0); }
.pv-ikon svg { width: 24px; height: 24px; }
.pv-kart h3 { margin: 0; font-size: 17px; letter-spacing: -.3px; }
.pv-rozet { display: inline-block; margin-left: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 800; background: var(--yesil-acik); color: #0c6e4b; vertical-align: 2px; }
.pv-bilgi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.pv-bilgi div { background: rgba(255,255,255,.7); border: 1px solid var(--cam-kenar); border-radius: 14px; padding: 12px 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--soluk); }
.pv-bilgi b { display: block; font-size: 22px; color: var(--yazi); letter-spacing: -.5px; }
.pv-mod { display: grid; gap: 10px; margin: 0 0 14px; }
.pv-mod label { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 1.5px solid var(--cizgi); background: #fff; cursor: pointer; }
.pv-mod input { margin-top: 3px; accent-color: var(--mavi); width: 18px; height: 18px; }
.pv-mod label:has(input:checked) { border-color: var(--mavi); background: var(--mavi-acik); }
.pv-mod b { display: block; font-size: 15px; } .pv-mod small { color: var(--soluk); font-weight: 600; font-size: 13px; line-height: 1.45; }
.pv-devam { padding: 14px 16px; margin-bottom: 12px; background: var(--turuncu-acik); border-radius: 16px; color: #9a4a12; font-weight: 700; font-size: 14px; display: grid; gap: 10px; }
.pv-devam .butonlar .btn { flex: 1; }
.pv-basla { width: 100%; padding: 15px; font-size: 16px; }
.pv-gecmis { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
.pv-gecmis span { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.7); border: 1px solid var(--cam-kenar); }
.pv-ust { position: sticky; top: 8px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 12px; }
.pv-sure { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 72px; display: flex; gap: 6px; align-items: center; }
.pv-sure.az { color: var(--pembe); animation: nabiz 1s infinite; }
@keyframes nabiz { 50% { opacity: .45; } }
.pv-ilerle { flex: 1; height: 8px; border-radius: 99px; background: rgba(20,27,52,.08); overflow: hidden; }
.pv-ilerle i { display: block; height: 100%; background: linear-gradient(90deg, var(--mavi), var(--mor)); border-radius: 99px; transition: width .3s; }
.pv-bitir { border: 0; background: var(--pembe); color: #fff; font: 800 13px var(--font); padding: 9px 14px; border-radius: 11px; cursor: pointer; }
.pv-soru { padding: 20px; animation: gir .22s ease; }
@keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.pv-soru-ust { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.pv-soru-ust .soru-no { margin: 0; }
.pv-isaret { border: 1.5px solid var(--cizgi); background: #fff; color: var(--soluk); font: 700 12px var(--font); padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.pv-isaret.acik { background: var(--turuncu-acik); border-color: var(--turuncu); color: #b65a14; }
.sik.secili { border-color: var(--mavi); background: var(--mavi-acik); }
.sik.secili .harf { background: var(--mavi); color: #fff; }
.pv-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 14px 0; }
.pv-izgara button { height: 38px; border-radius: 10px; border: 1.5px solid var(--cizgi); background: #fff; color: var(--soluk); font: 800 13px var(--font); cursor: pointer; position: relative; padding: 0; }
.pv-izgara button.cevapli { background: var(--mavi-acik); border-color: #b8c3f5; color: var(--mavi); }
.pv-izgara button.dogru { background: var(--yesil); border-color: var(--yesil); color: #fff; }
.pv-izgara button.yanlis { background: var(--pembe); border-color: var(--pembe); color: #fff; }
.pv-izgara button.su-an { box-shadow: 0 0 0 3px rgba(59,91,253,.3); border-color: var(--mavi); }
.pv-izgara button.isaretli::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--turuncu); border: 2px solid #fff; }
.pv-modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(20,27,52,.45); backdrop-filter: blur(4px); }
.pv-modal > div { background: #fff; border-radius: 22px; padding: 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); }
.pv-modal h3 { margin: 0 0 6px; font-size: 20px; } .pv-modal p { margin: 0 0 18px; color: var(--soluk); font-weight: 600; font-size: 14px; line-height: 1.5; }
.pv-modal .butonlar { justify-content: center; } .pv-modal .btn { flex: 1; }
.pv-halka { width: 156px; height: 156px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center;
  background: conic-gradient(var(--renk, var(--mavi)) calc(var(--p) * 1%), rgba(20,27,52,.08) 0); }
.pv-halka > div { width: 124px; height: 124px; border-radius: 50%; background: #fff; display: grid; place-items: center; align-content: center; }
.pv-halka b { font-size: 44px; letter-spacing: -2px; line-height: 1; } .pv-halka small { color: var(--soluk); font-weight: 700; font-size: 12px; }
.pv-sonuc { padding: 24px 20px; text-align: center; }
.pv-sonuc h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.4px; } .pv-sonuc > p { color: var(--soluk); font-weight: 600; margin: 0 0 16px; font-size: 14px; }
.pv-say { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.pv-say div { background: rgba(20,27,52,.04); border-radius: 12px; padding: 10px 4px; font-size: 11.5px; font-weight: 700; color: var(--soluk); }
.pv-say b { display: block; font-size: 19px; color: var(--yazi); }
.pv-say .d b { color: var(--yesil); } .pv-say .y b { color: var(--pembe); }
.pv-zayif { text-align: left; margin: 0 0 18px; display: grid; gap: 8px; }
.pv-zayif h4 { margin: 0; font-size: 14px; }
.pv-zayif a { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--pembe-acik); color: #a3264a; text-decoration: none; font-size: 13.5px; font-weight: 700; line-height: 1.35; }
.pv-zayif a span { flex: none; font-size: 12px; background: #fff; padding: 3px 8px; border-radius: 99px; }
.pv-filtre { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.pv-filtre button { border: 1.5px solid var(--cizgi); background: #fff; color: var(--soluk); font: 700 13px var(--font); padding: 7px 12px; border-radius: 99px; cursor: pointer; }
.pv-filtre button.aktif { background: var(--mavi); border-color: var(--mavi); color: #fff; }
.pv-inc { padding: 18px; margin-bottom: 12px; }
.pv-inc .soru-metin { font-size: 15.5px; }
.pv-inc .durum { font-size: 12px; font-weight: 800; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.pv-inc .durum i { font-style: normal; padding: 2px 9px; border-radius: 99px; }
.pv-inc .durum .d { background: var(--yesil-acik); color: #0c6e4b; } .pv-inc .durum .y { background: var(--pembe-acik); color: #a3264a; } .pv-inc .durum .b { background: rgba(20,27,52,.07); color: var(--soluk); }
.pv-inc .sik { cursor: default; font-size: 14px; padding: 10px 12px; }
.sik.senin { border-color: var(--pembe); background: var(--pembe-acik); }
.sik.senin .harf { background: var(--pembe); color: #fff; }
@media (max-width: 600px) { .pv-say { grid-template-columns: repeat(2, 1fr); } .pv-soru { padding: 18px 16px; } }


/* ===================== Premium liste görünümü ===================== */
.ders-hero { position: relative; overflow: hidden; border-radius: 28px; padding: 22px 20px 18px; color: #fff; margin-bottom: 18px;
  background: linear-gradient(135deg, var(--mavi), var(--mor)); box-shadow: 0 22px 40px -22px var(--mavi); isolation: isolate; }
.ders-hero::before { content: ""; position: absolute; right: -60px; top: -80px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.28), transparent); z-index: -1; }
.ders-hero::after { content: ""; position: absolute; left: -40px; bottom: -90px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.14), transparent); z-index: -1; }
.dh-etiket { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; backdrop-filter: blur(8px); }

<body>
<div class="isik"></div>
<div class="kap">
  <header class="ust cam">
    <a class="geri" id="geri" href="index.html">‹ Ders notları</a>
    <a class="logo" href="index.html"><img class="logo-ikon" src="/ikonlar/logo-128.png" alt="" width="34" height="34">KampüsCepte</a>
  </header>
  <main id="icerik"><div class="hata">Yükleniyor…</div></main>
  <footer class="alt-bilgi">
    <a href="index.html">Ana sayfa</a>
    <a href="dersler.html">Ders notları</a>
    <a href="hakkimizda.html">Hakkımızda ve iletişim</a>
    <a href="gizlilik.html">Gizlilik ve çerezler</a>
    <span>© 2026 KampüsCepte</span>
  </footer>
</div>

<script>
/* =====================================================================
   Ders sayfası: ders.html?d=ybs/1/bilisim-sistemleri
   notlar/<d>/ders.json dosyasını okur. Yeni ders için yeni bir klasöre
   aynı biçimde ders.json ve ünite PDF'lerini koyman yeterli.
   ===================================================================== */
const ICERIK = document.getElementById("icerik");
const dersYolu = new URLSearchParams(location.search).get("d") || "";
let ders = null, klasor = "";

function oku(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function yaz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const renk = i => "c" + (i % 5);
const ikonPdf = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M9 17h4"/></svg>';
const ikonOzet = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h14"/><path d="M8 7h8M8 11h6"/></svg>';
const ikonTest = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>';
const html = s => String(s).replace(/<span class="ust">/g, '<span class="ust-cizgi">');
const duz = s => String(s).replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&");
const TURLER = [["test", "Çoktan seçmeli", "Test"], ["dy", "Doğru – Yanlış", "D / Y"], ["bosluk", "Boşluk doldurma", "Boşluk"]];

async function yukle() {
  if (!/^[a-z0-9\-\/]+$/.test(dersYolu)) { ICERIK.innerHTML = '<div class="cam hata">Ders bulunamadı.</div>'; return; }
  klasor = "notlar/" + dersYolu + "/";
  try {
    const r = await fetch(klasor + "ders.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    ders = await r.json();
  } catch (e) {
    ICERIK.innerHTML = '<div class="cam hata">Ders yüklenemedi. Sayfayı yenilemeyi dene.</div>';
    return;
  }
  document.title = ders.ad + " – KampüsCepte";
  document.getElementById("geri").href = "index.html#" + (ders.sinif ? dersYolu.split("/").slice(0, 2).join("-") : dersYolu.split("/")[0]);
  window.addEventListener("hashchange", yonlendir);
  yonlendir();
}

function yonlendir() {
  clearInterval(pvZaman); P = null; pvFiltre = "hepsi";
  const m = location.hash.match(/^#test-(\d+)$/);
  const u = m && ders.uniteler.find(x => x.no === +m[1] && x.test);
  const pm = location.hash.match(/^#(?:prova|deneme)-([a-z0-9]+)$/);
  if (pm && pvTanim(pm[1])) pvGiris(pm[1]);
  else if (u) testAc(u); else listeCiz();
  window.scrollTo({ top: 0 });
}
function listeyeDon() { history.pushState("", "", location.pathname + location.search); yonlendir(); }

const anahtar = no => "kc-test:" + dersYolu + ":" + no;
const soruSayisi = u => u.test ? TURLER.reduce((t, [k]) => t + (u.test[k] || []).length, 0) : 0;

/* ===================== ÜNİTE LİSTESİ ===================== */
let listeSekme = "unite";
function listeCiz() {
  const toplam = ders.uniteler.reduce((t, u) => t + soruSayisi(u), 0);
  const pv = (ders.provalar || []).length, dn = (ders.denemeler || []).length;
  try { listeSekme = sessionStorage.getItem("kc-ls:" + dersYolu) || listeSekme; } catch (e) {}
  if ((listeSekme === "prova" && !pv) || (listeSekme === "deneme" && !dn)) listeSekme = "unite";
  const sek = [["unite", "Üniteler", ders.uniteler.length], ...(pv ? [["prova", "Provalar", pv]] : []), ...(dn ? [["deneme", "Denemeler", dn]] : [])];
  const cozulen = ders.uniteler.reduce((t, u) => { const k = oku(anahtar(u.no)); return t + (k ? k.cevap || 0 : 0); }, 0);
  let h = `
    <section class="ders-hero">
      <span class="dh-etiket">${ikonOzet}${ders.bolum}${ders.sinif ? " · " + ders.sinif + ". sınıf" : ""}</span>
      <h1>${ders.ad}</h1>
      <p class="dh-yazar">Hazırlayan · <b>${ders.yazarlar}</b></p>
      <div class="dh-istat"><div><b>${ders.uniteler.length}</b>ünite</div><div><b>${toplam}</b>soru</div><div><b>${pv + dn}</b>sınav</div></div>
      ${cozulen ? `<div class="dh-ilerle"><small><span>Çözülen sorular</span><span>${cozulen} / ${toplam}</span></small><i><b style="width:${Math.round(cozulen / toplam * 100)}%"></b></i></div>` : ""}
    </section>
    ${sek.length > 1 ? `<div class="sekmeler ls-sekme" role="tablist">${sek.map(([k, ad, n]) => `<button role="tab" data-ls="${k}" class="${listeSekme === k ? "aktif" : ""}"><span>${ad}</span><i>${n}</i></button>`).join("")}</div>` : ""}`;
  if (listeSekme === "prova") h += pvProvaHtml();
  else if (listeSekme === "deneme") h += pvDenemeHtml();
  else h += unitelerHtml();
  h += `<div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  ICERIK.querySelectorAll("[data-ls]").forEach(b => b.onclick = () => { listeSekme = b.dataset.ls; try { sessionStorage.setItem("kc-ls:" + dersYolu, listeSekme); } catch (e) {} listeCiz(); });
}
function unitelerHtml() {
  let h = `<div class="baslik">Üniteler</div><div class="uniteler">`;
  ders.uniteler.forEach((u, i) => {
    const t = soruSayisi(u);
    const s = oku(anahtar(u.no));
    const cevap = s ? s.cevap || 0 : 0;
    h += `
      <article class="unite cam">
        <div class="unite-ust">
          <span class="no ${renk(i)}"><span>Ünite<b>${u.no}</b></span></span>
          <div><h2>${u.ad}</h2><div class="meta"><span>${u.sayfa} sayfa</span>${t ? (cevap ? `<span class="ok">${t} sorudan ${s.dogru} doğru</span>` : `<span>${t} soru</span>`) : ""}</div></div>
        </div>
        ${cevap ? `<div class="ilerleme"><div style="width:${Math.round(cevap / t * 100)}%"></div></div>` : ""}
        <div class="butonlar">
          ${u.ozet ? `<a class="btn" href="${klasor + u.ozet}">${ikonOzet}Konu özeti</a>` : ""}
          <a class="btn${t ? "" : " ana"}" href="${klasor + u.pdf}" target="_blank" rel="noopener">${ikonPdf}Notu aç</a>
          ${t ? `<a class="btn ana" href="#test-${u.no}">${ikonTest}${cevap && cevap < t ? "Teste devam et" : "Kendini test et"}</a>` : ""}
        </div>
      </article>`;
  });
  return h + `</div>`;
}

/* ===================== TEST ===================== */
let A = null; // aktif test durumu

function karistir(dizi) {
  const d = dizi.slice();
  for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}

function testAc(u) {
  const kayit = oku(anahtar(u.no)) || {};
  const sekmeler = TURLER.filter(([k]) => (u.test[k] || []).length);
  A = { u, durum: kayit.durum || {}, sekmeler, sekme: sekmeler[0][0], sira: {}, sonuc: false };
  sekmeler.forEach(([k]) => A.sira[k] = 0);
  // ilk çözülmemiş soruya git
  for (const [k] of sekmeler) {
    const i = u.test[k].findIndex((q, j) => A.durum[k + j] === undefined);
    if (i >= 0) { A.sekme = k; A.sira[k] = i; break; }
  }
  // boşluk doldurma kelime havuzu: bütün cevaplar karışık
  A.havuz = karistir((u.test.bosluk || []).flatMap((q, i) => q.cs.map((c, j) => ({ c, q: i, j }))));
  testCiz();
}

function istatistik() {
  const ent = Object.entries(A.durum).filter(([k]) => /^(test|dy|bosluk)\d+$/.test(k));
  const dogru = ent.filter(([, v]) => v === true).length;
  return { dogru, yanlis: ent.length - dogru, cevap: ent.length, toplam: soruSayisi(A.u) };
}

function kaydet() {
  const s = istatistik();
  yaz(anahtar(A.u.no), { durum: A.durum, dogru: s.dogru, cevap: s.cevap });
}

function testCiz() {
  const u = A.u;
  const s = istatistik();
  let h = `
    <a class="geri" href="#" onclick="event.preventDefault(); listeyeDon();">‹ Üniteler</a>
    <section class="ust-bilgi" style="margin-top:6px">
      <small>Ünite ${u.no} · Kendini test et</small>
      <h1>${u.ad}</h1>
    </section>
    <div class="sekmeler" role="tablist">
      ${A.sekmeler.map(([k, uzun, kisa]) => `<button role="tab" data-s="${k}" class="${!A.sonuc && A.sekme === k ? "aktif" : ""}"><span class="uzun">${uzun}</span><span class="kisa">${kisa}</span></button>`).join("")}
    </div>
    <div class="skor"><span class="d">✓ ${s.dogru} doğru</span><span class="y">✕ ${s.yanlis} yanlış</span><span class="k">${s.toplam - s.cevap} kaldı</span><span class="ara"></span><button onclick="sifirla()">Baştan başla</button></div>`;
  if (u.not) h += `<div class="not-kutu">${u.not}</div>`;

  if (A.sonuc) {
    h += sonucHtml(s);
  } else {
    const k = A.sekme, liste = u.test[k], i = A.sira[k];
    h += `<div class="noktalar">${liste.map((q, j) => {
      const d = A.durum[k + j];
      return `<button data-git="${j}" class="${d === true ? "dogru" : d === false ? "yanlis" : ""} ${j === i ? "su-an" : ""}" aria-label="Soru ${j + 1}">${j + 1}</button>`;
    }).join("")}</div>`;
    if (k === "bosluk") h += havuzHtml();
    h += `<article class="soru cam" id="soru"></article>`;
    const sonSekme = A.sekmeler[A.sekmeler.length - 1][0] === k;
    const sonraki = A.sekmeler[A.sekmeler.findIndex(x => x[0] === k) + 1];
    const ileri = i < liste.length - 1 ? "Sonraki soru ›" : sonraki ? `${sonraki[2] === "D / Y" ? "Doğru – Yanlış" : sonraki[1]} ›` : "Sonucu gör ›";
    h += `<div class="gezinme">
      <button class="btn" id="geriBtn" ${i === 0 ? "disabled" : ""}>‹ Önceki</button>
      <button class="btn ana" id="ileriBtn">${ileri}</button>
    </div>`;
  }
  h += `<div class="vitrin">Sponsorlu alan</div>
    <div class="butonlar"><a class="btn" href="${klasor + u.pdf}" target="_blank" rel="noopener">${ikonPdf}Ünitenin notunu aç</a></div>`;
  ICERIK.innerHTML = h;

  ICERIK.querySelectorAll(".sekmeler button").forEach(b => b.onclick = () => { A.sonuc = false; A.sekme = b.dataset.s; testCiz(); });
  if (A.sonuc) return;
  ICERIK.querySelectorAll("[data-git]").forEach(b => b.onclick = () => { A.sira[A.sekme] = +b.dataset.git; testCiz(); });
  document.getElementById("geriBtn").onclick = () => { A.sira[A.sekme]--; testCiz(); };
  document.getElementById("ileriBtn").onclick = ileri;
  ICERIK.querySelectorAll(".kelime").forEach(b => b.onclick = () => kelimeKoy(b.dataset.c));
  soruCiz();
}

function ileri() {
  const k = A.sekme;
  if (A.sira[k] < A.u.test[k].length - 1) A.sira[k]++;
  else {
    const n = A.sekmeler.findIndex(x => x[0] === k) + 1;
    if (A.sekmeler[n]) A.sekme = A.sekmeler[n][0]; else A.sonuc = true;
  }
  testCiz();
  document.querySelector(".sekmeler").scrollIntoView({ behavior: "smooth", block: "start" });
}

function sifirla() {
  A.durum = {}; A.sonuc = false;
  A.sekmeler.forEach(([k]) => A.sira[k] = 0);
  A.sekme = A.sekmeler[0][0];
  A.havuz = karistir(A.havuz);
  kaydet(); testCiz();
}

function sonucHtml(s) {
  const sonraki = ders.uniteler.find(x => x.no > A.u.no && x.test);
  const oran = s.toplam ? s.dogru / s.toplam : 0;
  return `<div class="sonuc cam">
    <div class="buyuk">${s.dogru}/${s.toplam}</div>
    <p>${s.cevap < s.toplam ? `${s.toplam - s.cevap} soru boş kaldı.` : oran === 1 ? "Hepsi doğru, tebrikler!" : oran >= .7 ? "Güzel gidiyor. Yanlışlarına bir kez daha göz at." : "Bu üniteyi notlardan bir kez daha okumak iyi olur."}</p>
    <div class="satirlar">${A.sekmeler.map(([k, uzun]) => {
      const l = A.u.test[k], d = l.filter((q, j) => A.durum[k + j] === true).length;
      return `<div>${uzun}<b>${d}/${l.length}</b></div>`;
    }).join("")}</div>
    <div class="butonlar">
      <button class="btn" onclick="sifirla()">Tekrar çöz</button>
      ${sonraki ? `<a class="btn ana" href="#test-${sonraki.no}">Sonraki ünite ›</a>` : `<button class="btn ana" onclick="listeyeDon()">Ünitelere dön</button>`}
    </div></div>`;
}

/* Boşluk doldurma kelime havuzu */
function havuzHtml() {
  return `<div class="havuz cam"><div class="havuz-baslik">Kelime havuzu · boşluğa yerleştirmek için dokun</div><div class="kelimeler">${
    A.havuz.map(x => {
      const kullanildi = A.durum["bosluk" + x.q] !== undefined;
      return `<button class="kelime ${kullanildi ? "kullanildi" : ""}" data-c="${duz(x.c).replace(/"/g, "&quot;")}" ${kullanildi ? "disabled" : ""}>${html(x.c)}</button>`;
    }).join("")}</div></div>`;
}
let sonOdak = null;
function kelimeKoy(c) {
  const girisler = [...document.querySelectorAll("#soru .bosluk-giris:not([disabled])")];
  if (!girisler.length) return;
  const hedef = (sonOdak && girisler.includes(sonOdak) && !sonOdak.value) ? sonOdak : (girisler.find(g => !g.value) || sonOdak || girisler[0]);
  hedef.value = c;
  const sonraki = girisler.find(g => !g.value);
  if (sonraki) { sonraki.focus(); sonOdak = sonraki; }
}

function aciklamaHtml(iyi, dogruMetin, a, gosterildi) {
  if (gosterildi) return `<div class="aciklama kotu">Cevap: <b>${dogruMetin}</b>${a ? " " + html(a) : ""}</div>`;
  return `<div class="aciklama ${iyi ? "iyi" : "kotu"}"><b>${iyi ? "Doğru!" : "Yanlış."}</b>${!iyi && dogruMetin ? ` Doğru cevap: <b>${dogruMetin}</b>.` : ""}${a ? " " + html(a) : ""}</div>`;
}

function soruCiz() {
  const k = A.sekme, i = A.sira[k], q = A.u.test[k][i];
  const ana = k + i, el = document.getElementById("soru");
  const durum = A.durum[ana], cozuldu = durum !== undefined, sec = A.durum["_" + ana];
  let h = `<div class="soru-no">Soru ${i + 1} / ${A.u.test[k].length}</div>`;
  const bitir = (iyi, secim, gosterildi) => {
    A.durum[ana] = iyi; A.durum["_" + ana] = secim;
    if (gosterildi) A.durum["g" + ana] = true;
    kaydet(); testCiz();
  };

  if (k === "test") {
    h += `<div class="soru-metin">${html(q.s)}</div><div class="siklar">`;
    q.o.forEach((o, j) => {
      const cls = cozuldu ? (j === q.c ? "dogru" : j === sec ? "yanlis" : "") : "";
      h += `<button class="sik ${cls}" ${cozuldu ? "disabled" : ""} data-k="${j}"><span class="harf">${"ABCDE"[j]}</span><span>${html(o)}</span></button>`;
    });
    h += `</div>`;
    if (cozuldu) h += aciklamaHtml(durum, `${"ABCDE"[q.c]}) ${html(q.o[q.c])}`, q.a);
    el.innerHTML = h;
    if (!cozuldu) el.querySelectorAll(".sik").forEach(b => b.onclick = () => bitir(+b.dataset.k === q.c, +b.dataset.k));

  } else if (k === "dy") {
    h += `<div class="soru-metin">${html(q.s)}</div><div class="dy">`;
    [[true, "Doğru"], [false, "Yanlış"]].forEach(([v, ad]) => {
      const cls = cozuldu ? (v === q.c ? "dogru" : v === sec ? "yanlis" : "") : "";
      h += `<button class="sik ${cls}" ${cozuldu ? "disabled" : ""} data-v="${v}">${ad}</button>`;
    });
    h += `</div>`;
    if (cozuldu) h += aciklamaHtml(durum, q.c ? "Doğru" : "Yanlış", q.a);
    el.innerHTML = h;
    if (!cozuldu) el.querySelectorAll(".sik").forEach(b => b.onclick = () => { const v = b.dataset.v === "true"; bitir(v === q.c, v); });

  } else {
    const yazilan = sec || [];
    let n = 0;
    const metin = html(q.s).replace(/____/g, () => {
      const j = n++;
      const cls = cozuldu ? (boslukTekDogru(q, yazilan, j) ? "dogru" : "yanlis") : "";
      const gen = Math.min(Math.max(duz(q.cs[j] || "").length, 6) + 3, 34);
      return `<input class="bosluk-giris ${cls}" style="width:${gen}ch" data-j="${j}" aria-label="Boşluk ${j + 1}" autocomplete="off" autocapitalize="off" ${cozuldu ? "disabled" : ""} value="${(yazilan[j] || "").replace(/"/g, "&quot;")}">`;
    });
    h += `<div class="soru-metin">${metin}</div>`;
    if (cozuldu) h += aciklamaHtml(durum, q.cs.map(html).join(" · "), "", A.durum["g" + ana]);
    else h += `<div class="butonlar"><button class="btn ana" data-is="kontrol">Kontrol et</button><button class="btn" data-is="goster">Cevabı göster</button></div>`;
    el.innerHTML = h;
    if (!cozuldu) {
      const girisler = [...el.querySelectorAll(".bosluk-giris")];
      girisler.forEach(g => { g.addEventListener("focus", () => sonOdak = g); g.addEventListener("keydown", e => { if (e.key === "Enter") kontrol(); }); });
      sonOdak = girisler[0];
      const kontrol = () => {
        const bos = girisler.find(g => !g.value.trim());
        if (bos) { bos.focus(); return; }
        bitir(boslukDogru(q, girisler.map(g => g.value)), girisler.map(g => g.value.trim()));
      };
      el.querySelector('[data-is="kontrol"]').onclick = kontrol;
      el.querySelector('[data-is="goster"]').onclick = () => bitir(false, girisler.map(g => g.value.trim()), true);
    }
  }
}

/* Sırasız cevaplarda (ör. SUM(Adet * BirimFiyat)) boşluklar yer değiştirebilir */
function boslukDogru(q, degerler) {
  if (!q.sirasiz) return degerler.every((v, j) => eslesir(v, q.cs[j]));
  const kalan = q.cs.slice();
  return degerler.every(v => { const i = kalan.findIndex(c => eslesir(v, c)); if (i < 0) return false; kalan.splice(i, 1); return true; });
}
function boslukTekDogru(q, degerler, j) {
  return q.sirasiz ? q.cs.some(c => eslesir(degerler[j] || "", c)) : eslesir(degerler[j] || "", q.cs[j]);
}

/* Esnek karşılaştırma: büyük/küçük harf, Türkçe karakter, boşluk ve noktalama farkını
   önemsemez; parantez içindeki kısaltmayı ya da parantezsiz hâlini de kabul eder. */
function sade(s) {
  return duz(s).toLocaleLowerCase("tr")
    .replace(/[ıi̇]/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[âä]/g, "a")
    .replace(/[^a-z0-9%.*]/g, "").replace(/\./g, "");
}
function eslesir(yazilan, cevap) {
  let y = sade(yazilan);
  if (/^\d+$/.test(y) && /^\d+$/.test(sade(cevap))) return y.replace(/^0+(?=\d)/, "") === sade(cevap).replace(/^0+(?=\d)/, "");
  if (!y) return false;
  const ic = (cevap.match(/\((.*?)\)/g) || []).map(x => x.slice(1, -1));
  const adaylar = [cevap, cevap.replace(/\(.*?\)/g, ""), ...ic, ...ic.flatMap(x => x.split("/"))];
  return adaylar.some(a => sade(a) && sade(a) === y);
}

/* ===================== PROVA / DENEME ===================== */
const ikonSinav = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zM9 12l2 2 4-4M9 18h6"/></svg>';
const pvDevam = id => "kc-pv:" + dersYolu + ":" + id;
const pvGecmisK = id => "kc-pvs:" + dersYolu + ":" + id;
let P = null, pvZaman = null;
const dkSn = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

function pvTanim(id) {
  const p = (ders.provalar || []).find(x => x.id === id);
  if (p) return { ...p, tur: "prova", adet: p.sorular.length, puan: p.puan || 100 / p.sorular.length };
  const d = (ders.denemeler || []).find(x => x.id === id);
  if (d) return { ...d, tur: "deneme", puan: 100 / d.adet };
  return null;
}
function pvSorular(t) {
  if (t.tur === "prova") return t.sorular.map(q => ({ ...q, b: +((q.a || "").match(/\(Bölüm (\d+)\)/) || [])[1] || 0 }));
  const havuz = ders.uniteler.filter(u => t.bolumler.includes(u.no) && u.test).flatMap(u => (u.test.test || []).map(q => ({ ...q, b: u.no })));
  return karistir(havuz).slice(0, t.adet);
}
const pvOnek = t => t.tur === "prova" ? "prova" : "deneme";

/* Liste kartları */
function pvKart(x, sinif) {
  const t = pvTanim(x.id), g = oku(pvGecmisK(x.id)) || [], dv = oku(pvDevam(x.id));
  const en = g.length ? Math.max(...g.map(r => r.puan)) : null;
  return `<a class="pv-kart cam" href="#${pvOnek(t)}-${x.id}" style="text-decoration:none;color:inherit">
    <div class="pv-kart-ust"><span class="pv-ikon ${sinif}">${ikonSinav}</span>
    <div style="min-width:0"><h3>${x.ad}${dv && !dv.bitti ? '<span class="pv-rozet" style="background:var(--turuncu-acik);color:#9a4a12">Devam ediyor</span>' : en !== null ? `<span class="pv-rozet">En iyi ${Math.round(en)}</span>` : ""}</h3>
    <div class="meta">${x.konu} · ${t.adet} soru · ${t.sure} dk</div></div></div></a>`;
}
function pvProvaHtml() {
  let h = "";
  [["vize", "Vize provaları", "vize"], ["final", "Final provası", "final"]].forEach(([on, bas, sn]) => {
    const l = (ders.provalar || []).filter(x => x.id.startsWith(on));
    if (l.length) h += `<div class="baslik">${bas}</div><div class="pv-kartlar">${l.map(x => pvKart(x, sn)).join("")}</div>`;
  });
  return h || '<div class="cam hata">Prova yok.</div>';
}
function pvDenemeHtml() {
  const l = ders.denemeler || [];
  return `<div class="baslik">Karışık denemeler <small style="font-weight:600;color:var(--soluk)">her açılışta farklı sorular</small></div><div class="pv-kartlar">${l.map(x => pvKart(x, "karma")).join("")}</div>`;
}

/* Giriş ekranı */
function pvGiris(id) {
  const t = pvTanim(id), g = oku(pvGecmisK(id)) || [], dv = oku(pvDevam(id));
  P = null;
  let h = `<a class="geri" href="#" onclick="event.preventDefault(); listeyeDon();">‹ ${ders.ad}</a>
    <section class="ust-bilgi" style="margin-top:6px"><small>${t.tur === "prova" ? "Sınav provası" : "Karışık deneme"}</small><h1>${t.ad}</h1><p class="yazar">${t.konu}</p></section>
    <div class="pv-bilgi"><div><b>${t.adet}</b>soru</div><div><b>${t.sure}</b>dakika</div><div><b>${Math.round(t.puan * 100) / 100}</b>puan / soru</div></div>`;
  if (dv && !dv.bitti) {
    const kalan = dv.bitis ? dv.bitis - Date.now() : null;
    h += `<div class="pv-devam"><div>Yarım kalan bir denemen var (${dv.cevap.filter(x => x !== null).length}/${dv.sorular.length} cevaplı${kalan !== null ? kalan > 0 ? ` · ${dkSn(kalan)} kaldı` : " · süre doldu" : ""}).</div>
      <div class="butonlar"><button class="btn ana" id="pvSurdur">Devam et</button><button class="btn" id="pvSil">Vazgeç</button></div></div>`;
  }
  h += `<div class="pv-mod">
      <label><input type="radio" name="mod" value="sinav" checked><span><b>Sınav modu</b><small>${t.sure} dakika süre, cevaplar sonda açıklanır. Soruları işaretleyip geri dönebilirsin. Gerçek sınav gibi.</small></span></label>
      <label><input type="radio" name="mod" value="calisma"><span><b>Çalışma modu</b><small>Süre yok. Her soruyu işaretleyince doğru cevap ve açıklama hemen görünür.</small></span></label></div>
    <button class="btn ana pv-basla" id="pvBasla">${t.tur === "prova" ? "Provayı başlat" : "Denemeyi başlat"}</button>`;
  if (g.length) h += `<div class="baslik" style="margin-top:22px">Önceki denemelerin</div><div class="pv-gecmis">${g.slice().reverse().map(r => `<span>${Math.round(r.puan)} puan · ${r.d}D ${r.y}Y ${r.b}B</span>`).join("")}</div>`;
  h += `<div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  const mod = () => document.querySelector('input[name="mod"]:checked').value;
  document.getElementById("pvBasla").onclick = () => pvBaslat(t, mod());
  if (dv && !dv.bitti) {
    document.getElementById("pvSurdur").onclick = () => { P = dv; pvCiz(); };
    document.getElementById("pvSil").onclick = () => { try { localStorage.removeItem(pvDevam(id)); } catch (e) {} pvGiris(id); };
  }
}

function pvBaslat(t, mod) {
  const sorular = pvSorular(t);
  P = { id: t.id, ad: t.ad, tur: t.tur, mod, sorular, cevap: sorular.map(() => null), isaret: sorular.map(() => false), i: 0,
        puan: t.puan, sure: t.sure, bitis: mod === "sinav" ? Date.now() + t.sure * 60000 : null, basla: Date.now(), bitti: false };
  pvKaydet(); pvCiz();
}
function pvKaydet() { if (P && P.id !== "tekrar") yaz(pvDevam(P.id), P); }

/* Çözüm ekranı */
function pvCiz() {
  clearInterval(pvZaman);
  if (P.bitti) return pvSonuc();
  if (P.bitis && P.bitis <= Date.now()) return pvBitir(true);
  const n = P.sorular.length, i = P.i, q = P.sorular[i], c = P.cevap[i], sinav = P.mod === "sinav";
  const cevapli = P.cevap.filter(x => x !== null).length;
  let h = `<a class="geri" href="#" onclick="event.preventDefault(); clearInterval(pvZaman); listeyeDon();">‹ Çıkış (ilerlemen kayıtlı)</a>
    <div class="pv-ust cam">
      <div class="pv-sure" id="pvSure">${sinav ? "⏱ " + dkSn(P.bitis - Date.now()) : "Çalışma"}</div>
      <div class="pv-ilerle"><i style="width:${Math.round(cevapli / n * 100)}%"></i></div>
      <button class="pv-bitir" id="pvBitir">Bitir</button>
    </div>
    <article class="pv-soru cam"><div class="pv-soru-ust"><div class="soru-no">Soru ${i + 1} / ${n}</div>
      ${sinav ? `<button class="pv-isaret ${P.isaret[i] ? "acik" : ""}" id="pvIsaret">${P.isaret[i] ? "⚑ İşaretli" : "⚐ İşaretle"}</button>` : ""}</div>
      <div class="soru-metin">${html(q.s)}</div><div class="siklar">`;
  q.o.forEach((o, j) => {
    let cls = "";
    if (sinav) cls = c === j ? "secili" : "";
    else if (c !== null) cls = j === q.c ? "dogru" : j === c ? "yanlis" : "";
    h += `<button class="sik ${cls}" data-k="${j}" ${!sinav && c !== null ? "disabled" : ""}><span class="harf">${"ABCDE"[j]}</span><span>${html(o)}</span></button>`;
  });
  h += `</div>`;
  if (!sinav && c !== null) h += aciklamaHtml(c === q.c, `${"ABCDE"[q.c]}) ${html(q.o[q.c])}`, q.a);
  h += `</article>
    <div class="gezinme"><button class="btn" id="pvGeri" ${i === 0 ? "disabled" : ""}>‹ Önceki</button>
    <button class="btn ana" id="pvIleri">${i < n - 1 ? "Sonraki ›" : "Bitir ›"}</button></div>
    <div class="pv-izgara">${P.sorular.map((x, j) => {
      const d = P.cevap[j];
      const cls = sinav ? (d !== null ? "cevapli" : "") : (d === null ? "" : d === x.c ? "dogru" : "yanlis");
      return `<button class="${cls} ${j === i ? "su-an" : ""} ${P.isaret[j] ? "isaretli" : ""}" data-git="${j}">${j + 1}</button>`;
    }).join("")}</div>
    <div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  ICERIK.querySelectorAll(".siklar .sik").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (sinav) P.cevap[i] = P.cevap[i] === k ? null : k; else P.cevap[i] = k;
    pvKaydet(); pvCiz();
  });
  ICERIK.querySelectorAll("[data-git]").forEach(b => b.onclick = () => { P.i = +b.dataset.git; pvKaydet(); pvCiz(); window.scrollTo({ top: 0 }); });
  document.getElementById("pvGeri").onclick = () => { P.i--; pvKaydet(); pvCiz(); window.scrollTo({ top: 0 }); };
  document.getElementById("pvIleri").onclick = () => { if (i < n - 1) { P.i++; pvKaydet(); pvCiz(); window.scrollTo({ top: 0 }); } else pvBitirSor(); };
  document.getElementById("pvBitir").onclick = pvBitirSor;
  const is = document.getElementById("pvIsaret");
  if (is) is.onclick = () => { P.isaret[i] = !P.isaret[i]; pvKaydet(); pvCiz(); };
  if (sinav) {
    pvZaman = setInterval(() => {
      const kalan = P.bitis - Date.now(), el = document.getElementById("pvSure");
      if (kalan <= 0) { clearInterval(pvZaman); pvBitir(true); return; }
      if (el) { el.textContent = "⏱ " + dkSn(kalan); el.classList.toggle("az", kalan < 5 * 60000); }
    }, 1000);
  }
}

function pvBitirSor() {
  const bos = P.cevap.filter(x => x === null).length, isr = P.isaret.filter(Boolean).length;
  const m = document.createElement("div");
  m.className = "pv-modal";
  m.innerHTML = `<div><h3>${P.mod === "sinav" ? "Sınavı bitirelim mi?" : "Çalışmayı bitirelim mi?"}</h3>
    <p>${bos ? `<b>${bos}</b> soru boş.` : "Tüm soruları cevapladın."}${isr ? ` <b>${isr}</b> soru işaretli.` : ""} Bitirdikten sonra cevaplarını değiştiremezsin.</p>
    <div class="butonlar"><button class="btn" id="mDevam">Devam et</button><button class="btn ana" id="mBitir">Bitir</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#mDevam").onclick = () => m.remove();
  m.querySelector("#mBitir").onclick = () => { m.remove(); pvBitir(false); };
}

function pvBitir(sureDoldu) {
  clearInterval(pvZaman);
  P.bitti = true; P.sureDoldu = !!sureDoldu; P.bitisZ = Date.now();
  const s = pvSay();
  if (P.id !== "tekrar") {
    const g = oku(pvGecmisK(P.id)) || [];
    g.push({ t: Date.now(), d: s.d, y: s.y, b: s.b, puan: s.d * P.puan });
    yaz(pvGecmisK(P.id), g.slice(-8));
    try { localStorage.removeItem(pvDevam(P.id)); } catch (e) {}
  }
  pvSonuc();
}
function pvSay() {
  let d = 0, y = 0, b = 0;
  P.sorular.forEach((q, i) => { const c = P.cevap[i]; if (c === null) b++; else if (c === q.c) d++; else y++; });
  return { d, y, b };
}

/* Sonuç + inceleme */
let pvFiltre = "hepsi";
function pvSonuc() {
  const s = pvSay(), n = P.sorular.length, puan = Math.round(s.d * P.puan * 10) / 10, oran = s.d / n;
  const sureMs = Math.min(P.bitisZ || Date.now(), P.bitis || Infinity) - P.basla;
  const renk = oran >= .7 ? "var(--yesil)" : oran >= .5 ? "var(--turuncu)" : "var(--pembe)";
  const yorum = P.sureDoldu ? "Süre doldu. " : "";
  const metin = oran >= .85 ? "Harika, sınava hazırsın!" : oran >= .7 ? "Güzel sonuç. Yanlışlarına bir göz at." : oran >= .5 ? "Fena değil, eksik konuları tekrar edelim." : "Konuları tekrar okuyup yeniden dene, olur.";
  // zayıf bölümler
  const zayif = {};
  P.sorular.forEach((q, i) => { if (P.cevap[i] !== q.c && q.b) zayif[q.b] = (zayif[q.b] || 0) + 1; });
  const zl = Object.entries(zayif).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([no, k]) => ({ u: ders.uniteler.find(x => x.no === +no), k })).filter(x => x.u);
  const hata = s.y + s.b;
  let h = `<a class="geri" href="#" onclick="event.preventDefault(); listeyeDon();">‹ ${ders.ad}</a>
    <section class="pv-sonuc cam">
      <div class="pv-halka" style="--p:${Math.round(oran * 100)};--renk:${renk}"><div><b>${puan}</b><small>/ ${Math.round(P.puan * n)} puan</small></div></div>
      <h2>${P.ad}</h2><p>${yorum}${metin}</p>
      <div class="pv-say"><div class="d"><b>${s.d}</b>Doğru</div><div class="y"><b>${s.y}</b>Yanlış</div><div><b>${s.b}</b>Boş</div><div><b>${dkSn(sureMs)}</b>Süre</div></div>
      ${zl.length ? `<div class="pv-zayif"><h4>Tekrar etmen gereken bölümler</h4>${zl.map(x => `<a href="#test-${x.u.no}"><div>${x.u.no}. ${x.u.ad}</div><span>${x.k} hata</span></a>`).join("")}</div>` : ""}
      <div class="butonlar" style="justify-content:center">
        ${hata ? `<button class="btn ana" id="pvTekrar">Yanlışları tekrar çöz (${hata})</button>` : ""}
        ${P.id !== "tekrar" ? `<button class="btn" id="pvYeni">Yeniden dene</button>` : ""}
      </div>
    </section>
    <div class="baslik">Soruları incele</div>
    <div class="pv-filtre">${[["hepsi", "Tümü", n], ["yanlis", "Yanlış", s.y], ["bos", "Boş", s.b], ["dogru", "Doğru", s.d], ["isaret", "İşaretli", P.isaret.filter(Boolean).length]].map(([k, ad, c]) => `<button data-f="${k}" class="${pvFiltre === k ? "aktif" : ""}">${ad} ${c}</button>`).join("")}</div>`;
  P.sorular.forEach((q, i) => {
    const c = P.cevap[i], durum = c === null ? "bos" : c === q.c ? "dogru" : "yanlis";
    if (pvFiltre === "isaret" ? !P.isaret[i] : pvFiltre !== "hepsi" && pvFiltre !== durum) return;
    h += `<article class="pv-inc cam"><div class="durum">Soru ${i + 1}<i class="${durum === "dogru" ? "d" : durum === "yanlis" ? "y" : "b"}">${durum === "dogru" ? "Doğru" : durum === "yanlis" ? "Yanlış" : "Boş"}</i>${P.isaret[i] ? "⚑" : ""}</div>
      <div class="soru-metin">${html(q.s)}</div><div class="siklar">${q.o.map((o, j) => `<div class="sik ${j === q.c ? "dogru" : j === c ? "senin" : ""}"><span class="harf">${"ABCDE"[j]}</span><span>${html(o)}</span></div>`).join("")}</div>
      ${q.a ? `<div class="aciklama iyi"><b>Açıklama:</b> ${html(q.a)}</div>` : ""}</article>`;
  });
  h += `<div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  ICERIK.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { pvFiltre = b.dataset.f; pvSonuc(); });
  const tk = document.getElementById("pvTekrar");
  if (tk) tk.onclick = () => {
    const idx = P.sorular.map((q, i) => i).filter(i => P.cevap[i] !== P.sorular[i].c);
    const sorular = idx.map(i => P.sorular[i]);
    P = { id: "tekrar", ad: "Yanlışlarım", tur: "tekrar", mod: "calisma", sorular, cevap: sorular.map(() => null), isaret: sorular.map(() => false), i: 0, puan: 100 / sorular.length, bitis: null, basla: Date.now(), bitti: false };
    pvFiltre = "hepsi"; pvCiz(); window.scrollTo({ top: 0 });
  };
  const yn = document.getElementById("pvYeni");
  if (yn) yn.onclick = () => pvGiris(P.id);
}


yukle();
