<script>
/* =====================================================================
   Ders sayfası: ders.html?d=ybs/1/bilisim-sistemleri
   notlar/<d>/ders.json dosyasını okur. Yeni ders için yeni bir klasöre

   ===================================================================== */
const ICERIK = document.getElementById("icerik");
const dersYolu = new URLSearchParams(location.search).get("d") || "";
let ders = null, klasor = "";

function oku(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function yaz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const renk = i => "c" + (i % 5);
const ikonPdf = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M9 17h4"/></svg>';
const ikonOzet = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h14"/><path d="M8 7h8M8 11h6"/></svg>';
const ikonTest = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>';
const ikonKod = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>';
const html = s => String(s).replace(/<span class="ust">/g, '<span class="ust-cizgi">');
const duz = s => String(s).replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&");
const TURLER = [["test", "Çoktan seçmeli", "Test"], ["dy", "Doğru – Yanlış", "D / Y"], ["bosluk", "Boşluk doldurma", "Boşluk"]];

async function yukle() {
  /* 3. sınıf Veri Tabanı Sistemleri notları 1. sınıf Veri Tabanına Giriş ile aynıydı; notlar yalnızca 1. sınıfta tutuluyor, eski adres oraya gider */
  if (dersYolu === "ybs/3/veri-tabani-sistemleri") { location.replace("ders.html?d=ybs/1/veri-tabanina-giris" + location.hash); return; }
  if (!/^[a-z0-9\-\/]+$/.test(dersYolu)) { ICERIK.innerHTML = '<div class="cam hata">Ders bulunamadı.</div>'; return; }
  klasor = "notlar/" + dersYolu + "/";
  try {
    const r = await fetch(klasor + "ders.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    ders = await r.json();
  } catch (e) {
    ICERIK.innerHTML = '<div class="cam hata">Ders yüklenemedi. Sayfayı yenilemeyi dene.</div>';
    return;
  }
  document.title = ders.ad + " – KampüsCepte";
  if (ders.atolye && window.KodAtolye) KodAtolye.kur({ ders, yol: dersYolu, oku, yaz });
  document.getElementById("geri").href = "index.html#" + (ders.sinif ? dersYolu.split("/").slice(0, 2).join("-") : dersYolu.split("/")[0]);
  window.addEventListener("hashchange", yonlendir);
  yonlendir();
}

function yonlendir() {
  clearInterval(pvZaman); P = null; pvFiltre = "hepsi";
  const m = location.hash.match(/^#test-(\d+)$/);
  const u = m && ders.uniteler.find(x => x.no === +m[1] && x.test);
  const pm = location.hash.match(/^#(?:prova|deneme)-([a-z0-9]+)$/);
  const am = ders.atolye && window.KodAtolye && location.hash.match(/^#atolye(?:-(\d+\.\d+|b\d+))?$/);
  if (am) {
    const a = am[1];
    if (a && a[0] !== "b") KodAtolye.ac(a, ICERIK);
    else { KodAtolye.ayarla(a ? +a.slice(1) : 0); listeSekme = "atolye"; try { sessionStorage.setItem("kc-ls:" + dersYolu, "atolye"); } catch (e) {} listeCiz(); }
  }
  else if (pm && pvTanim(pm[1]) && pvTanim(pm[1]).adet) pvGiris(pm[1]);
  else if (u) testAc(u); else listeCiz();
  window.scrollTo({ top: 0 });
}
function listeyeDon() { history.pushState("", "", location.pathname + location.search); yonlendir(); }

const anahtar = no => "kc-test:" + dersYolu + ":" + no;
const soruSayisi = u => u.test ? TURLER.reduce((t, [k]) => t + (u.test[k] || []).length, 0) : 0;

/* ===================== ÜNİTE LİSTESİ ===================== */
let listeSekme = "unite";
function listeCiz() {
  const toplam = ders.uniteler.reduce((t, u) => t + soruSayisi(u), 0);
  const pv = (ders.provalar || []).length, dn = (ders.denemeler || []).length;
  try { listeSekme = sessionStorage.getItem("kc-ls:" + dersYolu) || listeSekme; } catch (e) {}
  const at = ders.atolye && window.KodAtolye ? KodAtolye.sayi() : 0;
  const ck = (ders.cikmis || []).length;
  if ((listeSekme === "cikmis" && !ck) || (listeSekme === "prova" && !pv) || (listeSekme === "deneme" && !dn) || (listeSekme === "atolye" && !at)) listeSekme = "unite";
  const sek = [...(ders.uniteler.length ? [["unite", "Üniteler", ders.uniteler.length]] : []), ...(at ? [["atolye", "Atölye", at]] : []), ...(pv ? [["prova", "Provalar", pv]] : []), ...(dn ? [["deneme", "Denemeler", dn]] : []), ...(ck ? [["cikmis", "Çıkmış", ck]] : [])];
  const cozulen = ders.uniteler.reduce((t, u) => { const k = oku(anahtar(u.no)); return t + (k ? k.cevap || 0 : 0); }, 0);
  if (!sek.some(x => x[0] === listeSekme) && sek.length) listeSekme = sek[0][0];
  let h = `
    <section class="ders-hero">
      <span class="dh-etiket">${ikonOzet}${ders.bolum}${ders.sinif ? " · " + ders.sinif + ". sınıf" : ""}</span>
      <h1>${ders.ad}</h1>
      <p class="dh-yazar">Hazırlayan · <b>${ders.yazarlar}</b></p>
      ${ders.uniteler.length ? (() => { const k = [[ders.uniteler.length, "ünite"], toplam ? [toplam, "soru"] : [ders.uniteler.reduce((a, u) => a + (+u.sayfa || 0), 0), "sayfa not"]]; if (pv + dn) k.push([pv + dn, "sınav"]); return `<div class="dh-istat" style="grid-template-columns:repeat(${k.length},1fr)">${k.map(([n, a]) => `<div><b>${n}</b>${a}</div>`).join("")}</div>`; })() : `<div class="dh-istat"><div><b>${(ders.cikmis || []).length}</b>çıkmış sınav</div></div>`}
      ${cozulen ? (() => { const oz = ders.uniteler.filter(u => soruSayisi(u)).map(uniteOzet), dg = oz.reduce((t, o) => t + o.dogru, 0), bt = oz.filter(o => o.kod === "tamam").length; return `<div class="dh-ilerle"><small><span>${cozulen} / ${toplam} soru çözüldü · %${Math.round(dg / cozulen * 100)} doğru</span><span>${bt} / ${oz.length} ünite tamam</span></small><i><b style="width:${Math.round(cozulen / toplam * 100)}%"></b></i></div>`; })() : ""}
    </section>
    ${ders.koc ? kocKart() : ""}
    ${sek.length > 1 || !ders.uniteler.length ? `<div class="sekmeler ls-sekme" role="tablist">${sek.map(([k, ad, n]) => `<button role="tab" data-ls="${k}" class="${listeSekme === k ? "aktif" : ""}"><span>${ad}</span><i>${n}</i></button>`).join("")}</div>` : ""}`;
  if (listeSekme === "atolye") h += KodAtolye.listeHtml();
  else if (listeSekme === "prova") h += pvProvaHtml();
  else if (listeSekme === "deneme") h += pvDenemeHtml();
  else if (listeSekme === "cikmis") h += cikmisHtml();
  else h += unitelerHtml();
  h += `<div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  if (listeSekme === "atolye") KodAtolye.listeBagla(ICERIK, listeCiz);
  if (listeSekme === "cikmis" || ICERIK.querySelector(".unite[data-ck]")) cikmisBagla();
  ICERIK.querySelectorAll("[data-ls]").forEach(b => b.onclick = () => { listeSekme = b.dataset.ls; try { sessionStorage.setItem("kc-ls:" + dersYolu, listeSekme); } catch (e) {} listeCiz(); });
}
/* SINAV KOÇUM giriş kartı (ders.json: "koc": "koc.html") */
function kocKart() {
  const kid = ders.koc_id || "algoritma", kn = ders.koc_konu || 8;
  let st = null; try { st = JSON.parse(localStorage.getItem("kc-koc:" + kid)); } catch (e) {}
  const ogr = st && st.konu ? Object.keys(st.konu).filter(n => +n <= kn && st.konu[n].gecti).length : 0;
  const alt = !st || !st.seviye ? (ders.koc_alt || "Seviye tespitiyle başla · sana özel plan, anlatım, alıştırma ve gerçek sınav simülasyonu") : ogr + " / " + kn + " konu öğrenildi · kaldığın yerden devam et";
  return `<a class="koc-kart" href="${ders.koc}"><span class="koc-ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span>
    <div><small>Yeni · Kişisel sınav koçun</small><b>SINAV KOÇUM</b><span>${alt}</span>${st && st.seviye ? `<i class="koc-cubuk"><em style="width:${Math.round(Math.min(ogr, kn) / kn * 100)}%"></em></i>` : ""}</div><span class="koc-ok">›</span></a>`;
}
function cikmisHtml() {
  const indir = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
  const goz = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const yildiz = '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
  const GR = [["vize", "Vize"], ["final", "Final"], ["but", "Bütünleme"], ["diger", "Diğer sınavlar"]];
  let h = "";
  GR.forEach(([tk, tad]) => {
  const grup = ders.cikmis.filter(c => (c.tur || "diger") === tk);
  if (!grup.length) return;
  h += `<div class="baslik">${tad} <span style="color:var(--soluk);font-weight:700">· ${grup.length}</span></div><div class="ck-liste">`;
  grup.forEach(c => {
    const yol = klasor + c.gorsel, dosya = "KampusCepte-" + c.gorsel.split("/").pop().split("?")[0];
    h += `
      <article class="ck-kart cam" data-ck="${c.id}">
        <a class="ck-onizle" href="${yol}" target="_blank" rel="noopener"><img src="${yol}" alt="${c.ad}" loading="lazy"></a>
        <div>
          <span class="ck-rozet${c.cevapsiz ? " ck-klasik" : ""}">● ${c.cevapsiz ? "KLASİK" : "CEVAPLI"} · ${c.soru} SORU</span>
          <h2>${c.ad}</h2>
          <div class="ck-alt">${c.alt}</div>
          <div class="ck-istat">
            <div>${indir}<b class="ck-say">…</b> indirme</div>
            <div><b class="ck-ort">–</b><span class="ck-yildiz">${[1,2,3,4,5].map(n => `<button aria-label="${n} yıldız">${yildiz}</button>`).join("")}</span><span class="ck-oy"></span></div>
          </div>
          <div class="ck-butonlar">
            <a class="btn" href="${yol}" target="_blank" rel="noopener">${goz}Görüntüle</a>
            <a class="btn ana ck-indir" href="${yol}" download="${dosya}">${indir}İndir</a>
          </div>
        </div>
      </article>`;
  });
  h += `</div>`;
  });
  return h;
}
let ckYuklendi = false;
function cikmisBagla() {
  if (window.Cikmis) return Cikmis.bagla(ICERIK);
  document.addEventListener("cikmis-hazir", () => Cikmis.bagla(ICERIK), { once: true });
  if (ckYuklendi) return; ckYuklendi = true;
  const f = document.createElement("script"); f.src = "firebase-ayar.js?v=2";
  f.onload = () => { const m = document.createElement("script"); m.type = "module"; m.src = "cikmis.js?v=3"; document.body.appendChild(m); };
  document.body.appendChild(f);
}
const ikonIndir = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
const ikonYildiz = '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
function unitelerHtml() {
  const grup = ders.uniteler.some(u => u.sinav);
  const GA = { vize: "Vize konuları", final: "Final konuları", ek: "Ek · hızlı tekrar" };
  let h = grup ? "" : `<div class="baslik">Üniteler</div><div class="uniteler">`;
  let sonGrup = null;
  ders.uniteler.forEach((u, i) => {
    if (grup && u.sinav !== sonGrup) {
      if (sonGrup !== null) h += `</div>`;
      sonGrup = u.sinav;
      const n = ders.uniteler.filter(x => x.sinav === u.sinav).length;
      h += `<div class="baslik">${GA[u.sinav] || u.sinav} <span style="color:var(--soluk);font-weight:700">· ${n}</span></div><div class="uniteler">`;
    }
    const o = uniteOzet(u), t = o.t;
    const nid = ("not-" + dersYolu.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + u.no).slice(0, 60);
    const ndosya = "KampusCepte-" + (ders.ad || "not").replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü]+/g, "-") + "-Unite-" + u.no + ".pdf";
    const anaYazi = o.kod === "yok" ? "Teste başla" : o.kod === "devam" ? `Teste devam et · ${o.cevap}/${t}` : "Sonucu gör";
    h += `
      <article class="unite cam u2" data-ck="${nid}">
        <div class="u2-ust">
          <span class="u2-no">Ünite ${u.no}</span>
          ${t ? `<span class="u2-durum ${o.kod}">${o.ad}</span>` : ""}
        </div>
        <h2>${u.ad}</h2>
        ${u.aciklama ? `<p class="u2-acik">${u.aciklama}</p>` : ""}
        <div class="u2-meta">${t ? `<span>${t} soru</span>` : ""}<span>${u.sayfa} sayfa not</span>${o.kod !== "yok" && t ? `<span class="u2-basari">%${o.basari} başarı</span>` : ""}</div>
        ${t && o.kod !== "yok" ? `<div class="u2-cubuk" aria-hidden="true"><i class="d" style="width:${o.dogru / t * 100}%"></i><i class="y" style="width:${o.yanlis / t * 100}%"></i></div>` : ""}
        <div class="ck-istat unite-istat">
          <div>${ikonIndir}<b class="ck-say">…</b> indirme</div>
          <div><b class="ck-ort">–</b><span class="ck-yildiz">${[1,2,3,4,5].map(n => `<button aria-label="${n} yıldız">${ikonYildiz}</button>`).join("")}</span><span class="ck-oy"></span></div>
        </div>
        <div class="u2-butonlar">
          ${t ? `<a class="btn ana u2-ana" href="#test-${u.no}">${ikonTest}${anaYazi}</a>` : ""}
          ${u.atolye && u.atolye.length && window.KodAtolye ? `<a class="btn ana btn-atolye u2-ana" href="#atolye-b${u.no}">${ikonKod}Kod atölyesi · ${u.atolye.length} soru</a>` : ""}
          ${u.ozet ? `<a class="btn" href="${klasor + u.ozet}">${ikonOzet}Konu özeti</a>` : ""}
          <a class="btn${t ? "" : " ana"}" href="${klasor + u.pdf}" target="_blank" rel="noopener">${ikonPdf}Notu aç</a>
          <a class="btn ck-indir" href="${klasor + u.pdf}" download="${ndosya}">${ikonIndir}İndir</a>
        </div>
      </article>`;
  });
  return h + `</div>`;
}

/* ===================== TEST (Ünite değerlendirme) =====================
   Kayıt: localStorage "kc-test:<ders>:<ünite>" → { durum, dogru, cevap, bitti?, konum?, gecmis? }
   durum[tür+sıra] = true/false (doğru/yanlış), durum["_"+anahtar] = öğrencinin cevabı,
   durum["g"+anahtar] = cevap gösterildi (boşluk). Eski kayıtlar olduğu gibi okunur. */
let A = null; // aktif test durumu

function karistir(dizi) {
  const d = dizi.slice();
  for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
const TUR_AD = { test: "Çoktan seçmeli", dy: "Doğru – Yanlış", bosluk: "Boşluk doldurma" };

/* Ünitenin kayıtlı durumundan özet: Başlanmadı / Devam ediyor / Tamamlandı / Tekrar öneriliyor */
function uniteOzet(u) {
  const t = soruSayisi(u), s = oku(anahtar(u.no)) || {};
  const d = s.durum || {};
  const ent = Object.entries(d).filter(([k]) => /^(test|dy|bosluk)\d+$/.test(k));
  const cevap = ent.length, dogru = ent.filter(([, v]) => v === true).length;
  const gecmis = s.gecmis || [];
  const bitti = !!s.bitti || (t > 0 && cevap >= t);
  const basari = t ? Math.round(dogru / t * 100) : 0;
  let kod = "yok", ad = "Başlanmadı";
  if (cevap || gecmis.length) {
    if (!bitti) { kod = "devam"; ad = "Devam ediyor"; }
    else if (basari >= 70) { kod = "tamam"; ad = "Tamamlandı"; }
    else { kod = "tekrar"; ad = "Tekrar öneriliyor"; }
  }
  return { t, cevap, dogru, yanlis: cevap - dogru, bos: t - cevap, bitti, basari, kod, ad, gecmis };
}

function testAc(u) {
  const kayit = oku(anahtar(u.no)) || {};
  const sekmeler = TURLER.filter(([k]) => (u.test[k] || []).length);
  const liste = [];
  sekmeler.forEach(([k]) => u.test[k].forEach((q, j) => liste.push({ k, j, key: k + j })));
  A = { u, durum: kayit.durum || {}, sekmeler, liste, filtre: null, i: 0, secim: {}, mod: "coz", bitti: !!kayit.bitti, gecmis: kayit.gecmis || [], panel: false, incFiltre: "yanlis" };
  // boşluk doldurma kelime havuzu: bütün cevaplar karışık
  A.havuz = karistir((u.test.bosluk || []).flatMap((q, i) => q.cs.map((c, j) => ({ c, q: i, j }))));
  const ilkBos = liste.findIndex(x => A.durum[x.key] === undefined);
  if (A.bitti || ilkBos < 0) A.mod = "sonuc";
  else A.i = Number.isInteger(kayit.konum) && kayit.konum < liste.length && A.durum[liste[kayit.konum].key] === undefined ? kayit.konum : ilkBos;
  testCiz();
}

const aktifListe = () => A.filtre ? A.liste.filter(x => A.filtre.includes(x.key)) : A.liste;

function istatistik() {
  const ent = Object.entries(A.durum).filter(([k]) => /^(test|dy|bosluk)\d+$/.test(k));
  const dogru = ent.filter(([, v]) => v === true).length;
  return { dogru, yanlis: ent.length - dogru, cevap: ent.length, toplam: soruSayisi(A.u) };
}

function kaydet() {
  const s = istatistik();
  const eski = oku(anahtar(A.u.no)) || {};
  const l = aktifListe(), x = l[A.i];
  yaz(anahtar(A.u.no), { ...eski, durum: A.durum, dogru: s.dogru, cevap: s.cevap, bitti: A.bitti, gecmis: A.gecmis, konum: x ? A.liste.indexOf(x) : 0 });
}

/* Küçük onay penceresi (alert/confirm yerine) */
function onayla(baslik, metin, evet, hayir, cb) {
  const m = document.createElement("div");
  m.className = "pv-modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-labelledby", "onayB");
  m.innerHTML = `<div><h3 id="onayB">${baslik}</h3><p>${metin}</p><div class="butonlar"><button class="btn" data-h>${hayir}</button><button class="btn ana" data-e>${evet}</button></div></div>`;
  document.body.appendChild(m);
  const kapat = () => { m.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") kapat(); };
  document.addEventListener("keydown", esc);
  m.querySelector("[data-h]").onclick = kapat;
  m.querySelector("[data-e]").onclick = () => { kapat(); cb(); };
  m.onclick = e => { if (e.target === m) kapat(); };
  m.querySelector("[data-e]").focus();
}

const ikonIzgara = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
const ikonGeri = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

function testCiz() {
  const u = A.u;
  if (A.mod === "sonuc") return sonucCiz();
  if (A.mod === "incele") return inceleCiz();
  const l = aktifListe();
  if (!l.length) { A.mod = "sonuc"; return sonucCiz(); }
  if (A.i >= l.length) A.i = l.length - 1;
  const x = l[A.i], cozulen = l.filter(y => A.durum[y.key] !== undefined).length;
  const yuzde = Math.round(cozulen / l.length * 100);
  let h = `
    <div class="tu-ust">
      <div class="tu-satir">
        <button class="tu-ikon" onclick="listeyeDon()" aria-label="Ünitelere dön">${ikonGeri}</button>
        <div class="tu-baslik"><small>Ünite ${u.no} · ${A.filtre ? "Yanlışları tekrar çöz" : "Kendini test et"}</small><b>${u.ad}</b></div>
        <button class="tu-bitir" id="bitirBtn">Bitir</button>
      </div>
      <div class="tu-satir tu-ilerleme">
        <span class="tu-sayac"><b>${A.i + 1}</b> / ${l.length} soru</span>
        <div class="tu-cubuk" role="progressbar" aria-label="Çözülen sorular" aria-valuemin="0" aria-valuemax="${l.length}" aria-valuenow="${cozulen}"><i style="width:${yuzde}%"></i></div>
        <button class="tu-panel-btn${A.panel ? " acik" : ""}" id="panelBtn" aria-expanded="${A.panel}" aria-controls="tuPanel">${ikonIzgara}<span>Sorular</span></button>
      </div>
      ${A.panel ? panelHtml(l) : ""}
    </div>`;
  if (u.not) h += `<div class="not-kutu">${u.not}</div>`;
  if (x.k === "bosluk") h += havuzHtml();
  h += `<article class="soru tu-soru" id="soru" aria-live="polite"></article>
    <div class="tu-alt">
      <button class="btn" id="geriBtn" ${A.i === 0 ? "disabled" : ""} aria-label="Önceki soru">‹ Önceki</button>
      <button class="btn ana" id="anaBtn"></button>
    </div>`;
  ICERIK.innerHTML = h;
  document.getElementById("bitirBtn").onclick = bitirSor;
  document.getElementById("panelBtn").onclick = () => { A.panel = !A.panel; testCiz(); };
  document.getElementById("geriBtn").onclick = () => git(A.i - 1);
  ICERIK.querySelectorAll("[data-git]").forEach(b => b.onclick = () => { A.panel = false; git(+b.dataset.git); });
  ICERIK.querySelectorAll(".kelime").forEach(b => b.onclick = () => { kelimeKoy(b.dataset.c); anaGuncelle(); });
  soruCiz();
}

function panelHtml(l) {
  const gruplar = [];
  l.forEach((x, n) => { let g = gruplar.find(y => y.k === x.k); if (!g) gruplar.push(g = { k: x.k, o: [] }); g.o.push([x, n]); });
  return `<div class="tu-panel" id="tuPanel">
    <div class="tu-lejant"><span><i class="d"></i>Doğru</span><span><i class="y"></i>Yanlış</span><span><i></i>Boş</span><span><i class="s"></i>Şu an</span></div>
    ${gruplar.map(g => `${gruplar.length > 1 ? `<div class="tu-grup">${TUR_AD[g.k]}</div>` : ""}<div class="pv-izgara">${g.o.map(([x, n]) => {
      const d = A.durum[x.key];
      return `<button data-git="${n}" class="${d === true ? "dogru" : d === false ? "yanlis" : ""}${n === A.i ? " su-an" : ""}" aria-label="Soru ${n + 1}${d === true ? ", doğru" : d === false ? ", yanlış" : ", boş"}">${n + 1}</button>`;
    }).join("")}</div>`).join("")}
  </div>`;
}

function git(n) {
  const l = aktifListe();
  if (n < 0 || n >= l.length) return;
  A.i = n; kaydet(); testCiz();
  const ust = document.querySelector(".tu-ust");
  if (ust && ust.getBoundingClientRect().top < 0) ust.scrollIntoView({ block: "start" });
}

/* Sonraki: önce sıradaki, yoksa baştaki boş soruya; hiç boş yoksa sonuç */
function sonraki(bosBirak) {
  const l = aktifListe();
  if (A.i < l.length - 1) return git(A.i + 1);
  const bos = l.findIndex(y => A.durum[y.key] === undefined);
  if (bos >= 0 && !bosBirak && bos !== A.i) return git(bos);
  bitirSor();
}

function bitirSor() {
  const l = aktifListe(), bos = l.filter(y => A.durum[y.key] === undefined).length;
  if (!bos) return testiBitir();
  onayla("Testi bitir", `${bos} soru boş kaldı. Bitirirsen boş sorular sonuçta “boş” olarak görünür.`, "Testi bitir", "Devam et", testiBitir);
}

function testiBitir() {
  const s = istatistik();
  A.bitti = true; A.filtre = null; A.mod = "sonuc";
  A.gecmis = (A.gecmis || []).concat([{ t: Date.now(), d: s.dogru, y: s.yanlis, b: s.toplam - s.cevap, n: s.toplam }]).slice(-10);
  kaydet(); testCiz(); window.scrollTo({ top: 0 });
}

function sifirla() {
  onayla("Baştan başla", "Bu ünitedeki bütün cevapların silinir. Önceki sonuçların geçmişte kalır.", "Baştan başla", "Vazgeç", () => {
    A.durum = {}; A.secim = {}; A.bitti = false; A.filtre = null; A.i = 0; A.mod = "coz";
    A.havuz = karistir(A.havuz);
    kaydet(); testCiz(); window.scrollTo({ top: 0 });
  });
}

function yanlislariTekrar() {
  const yanlis = A.liste.filter(x => A.durum[x.key] === false || A.durum[x.key] === undefined).map(x => x.key);
  if (!yanlis.length) return;
  yanlis.forEach(k => { delete A.durum[k]; delete A.durum["_" + k]; delete A.durum["g" + k]; });
  A.filtre = yanlis; A.i = 0; A.secim = {}; A.bitti = false; A.mod = "coz";
  kaydet(); testCiz(); window.scrollTo({ top: 0 });
}

/* ---------- Sonuç ekranı ---------- */
function degerlendirme(p) {
  if (p >= 90) return ["Mükemmel!", "Bu üniteyi büyük ölçüde öğrenmişsin."];
  if (p >= 75) return ["Çok iyi!", "Birkaç noktayı tekrar ederek başarını artırabilirsin."];
  if (p >= 50) return ["İyi bir başlangıç", "Eksik olduğun konulara biraz daha çalışmalısın."];
  return ["Tekrar etmekte fayda var", "Bu üniteyi notlardan yeniden gözden geçirmeni öneriyoruz."];
}
function halkaHtml(p, renk) {
  const r = 52, c = 2 * Math.PI * r;
  return `<div class="tu-halka" role="img" aria-label="Başarı yüzde ${p}">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" class="iz"/><circle cx="60" cy="60" r="${r}" class="dolu" style="stroke:${renk};stroke-dasharray:${c};stroke-dashoffset:${c}" data-hedef="${c * (1 - p / 100)}"/></svg>
    <div><b>%${p}</b><small>başarı</small></div></div>`;
}
function sonucCiz() {
  const u = A.u, s = istatistik(), bos = s.toplam - s.cevap;
  const p = s.toplam ? Math.round(s.dogru / s.toplam * 100) : 0;
  const [bas, alt] = degerlendirme(p);
  const renk = p >= 75 ? "var(--yesil)" : p >= 50 ? "var(--mavi)" : "var(--turuncu)";
  const g = A.gecmis || [], onceki = g.length >= 2 ? g[g.length - 2] : null;
  const fark = onceki ? p - Math.round(onceki.d / onceki.n * 100) : 0;
  const snr = ders.uniteler.find(x => x.no > u.no && x.test);
  let h = `
    <div class="tu-ust tu-ust-sade">
      <div class="tu-satir">
        <button class="tu-ikon" onclick="listeyeDon()" aria-label="Ünitelere dön">${ikonGeri}</button>
        <div class="tu-baslik"><small>Ünite ${u.no} · Sonuç</small><b>${u.ad}</b></div>
      </div>
    </div>
    <section class="sonuc cam tu-sonuc">
      ${halkaHtml(p, renk)}
      <h2>${bas}</h2>
      <p>${alt}${!A.bitti && bos ? ` <span class="tu-yarim">Test henüz bitmedi · ${bos} soru boş.</span>` : ""}</p>
      <div class="pv-say">
        <div><b>${s.toplam}</b>Toplam</div>
        <div class="d"><b>${s.dogru}</b>Doğru</div>
        <div class="y"><b>${s.yanlis}</b>Yanlış</div>
        <div><b>${bos}</b>Boş</div>
      </div>
      ${onceki ? `<div class="tu-kiyas">Önceki denemen <b>%${Math.round(onceki.d / onceki.n * 100)}</b> · bu deneme <b>%${p}</b> <span class="${fark > 0 ? "art" : fark < 0 ? "eks" : ""}">${fark > 0 ? "▲ +" + fark : fark < 0 ? "▼ " + fark : "aynı"}</span></div>` : ""}
      ${A.sekmeler.length > 1 ? `<div class="tu-turler">${A.sekmeler.map(([k, uzun]) => {
        const l = u.test[k], d = l.filter((q, j) => A.durum[k + j] === true).length;
        return `<div><span>${uzun}</span><i><em style="width:${Math.round(d / l.length * 100)}%"></em></i><b>${d}/${l.length}</b></div>`;
      }).join("")}</div>` : ""}
      <div class="tu-aksiyon">
        ${s.yanlis + bos ? `<button class="btn ana" id="inceleBtn">${s.yanlis ? "Yanlışlarımı incele" : "Boş soruları incele"} <i>${s.yanlis + bos}</i></button>
        <button class="btn" id="tekrarYBtn">${s.yanlis && bos ? "Yanlış ve boşları çöz" : bos ? "Boşları çöz" : "Yanlışları tekrar çöz"}</button>` : ""}
        
        <button class="btn" id="sifirBtn">Testi baştan çöz</button>
        ${snr ? `<a class="btn${s.yanlis + bos ? "" : " ana"}" href="#test-${snr.no}">Sonraki ünite ›</a>` : `<button class="btn${s.yanlis + bos ? "" : " ana"}" onclick="listeyeDon()">Ünitelere dön</button>`}
      </div>
    </section>
    ${g.length ? `<div class="tu-gecmis"><div class="baslik">Denemelerin</div>${g.slice().reverse().map((x, n) => `<div class="tu-g-satir"><span>${new Date(x.t).toLocaleDateString("tr-TR", { day: "numeric", month: "short" })}${n === 0 ? " · son" : ""}</span><span>${x.d} doğru · ${x.y} yanlış${x.b ? " · " + x.b + " boş" : ""}</span><b>%${Math.round(x.d / x.n * 100)}</b></div>`).join("")}</div>` : ""}
    <div class="butonlar tu-not"><a class="btn" href="${klasor + u.pdf}" target="_blank" rel="noopener">${ikonPdf}Ünitenin notunu aç</a></div>`;
  ICERIK.innerHTML = h;
  requestAnimationFrame(() => requestAnimationFrame(() => { const c = ICERIK.querySelector(".tu-halka .dolu"); if (c) c.style.strokeDashoffset = c.dataset.hedef; }));
  const b = id => document.getElementById(id);
  if (b("inceleBtn")) b("inceleBtn").onclick = () => { A.mod = "incele"; A.incFiltre = s.yanlis ? "yanlis" : "bos"; testCiz(); window.scrollTo({ top: 0 }); };
  if (b("tekrarYBtn")) b("tekrarYBtn").onclick = yanlislariTekrar;
  if (b("devamBtn")) b("devamBtn").onclick = () => { A.mod = "coz"; A.i = Math.max(0, A.liste.findIndex(x => A.durum[x.key] === undefined)); testCiz(); };
  b("sifirBtn").onclick = sifirla;
}

/* ---------- Yanlışları inceleme ---------- */
function inceleCiz() {
  const u = A.u;
  const say = { yanlis: 0, bos: 0, hepsi: A.liste.length };
  A.liste.forEach(x => { const d = A.durum[x.key]; if (d === false) say.yanlis++; else if (d === undefined) say.bos++; });
  const uyar = x => { const d = A.durum[x.key]; return A.incFiltre === "hepsi" || (A.incFiltre === "yanlis" && d === false) || (A.incFiltre === "bos" && d === undefined); };
  let h = `
    <div class="tu-ust tu-ust-sade">
      <div class="tu-satir">
        <button class="tu-ikon" id="sonucaDon" aria-label="Sonuca dön">${ikonGeri}</button>
        <div class="tu-baslik"><small>Ünite ${u.no} · Yanlışlarımı incele</small><b>${u.ad}</b></div>
      </div>
    </div>
    <div class="pv-filtre" role="tablist">${[["yanlis", "Yanlış"], ["bos", "Boş"], ["hepsi", "Tümü"]].map(([k, ad]) => `<button role="tab" aria-selected="${A.incFiltre === k}" data-f="${k}" class="${A.incFiltre === k ? "aktif" : ""}">${ad} · ${say[k]}</button>`).join("")}</div>`;
  const secilen = A.liste.map((x, n) => [x, n]).filter(([x]) => uyar(x));
  if (!secilen.length) h += `<div class="cam hata">Bu grupta soru yok.</div>`;
  secilen.forEach(([x, n]) => {
    const q = u.test[x.k][x.j], d = A.durum[x.key], sec = A.durum["_" + x.key];
    const durum = d === true ? `<i class="d">Doğru</i>` : d === false ? `<i class="y">Yanlış</i>` : `<i class="b">Boş</i>`;
    let g = `<article class="pv-inc cam"><div class="durum">Soru ${n + 1} · ${TUR_AD[x.k]} ${durum}</div>`;
    if (x.k === "test") {
      g += `<div class="soru-metin">${html(q.s)}</div><div class="siklar">${q.o.map((o, j) => `<div class="sik ${j === q.c ? "dogru" : j === sec ? "senin" : ""}"><span class="harf">${"ABCDE"[j]}</span><span>${html(o)}${j === sec && j !== q.c ? ' <em class="tu-etiket">senin cevabın</em>' : ""}</span></div>`).join("")}</div>`;
    } else if (x.k === "dy") {
      g += `<div class="soru-metin">${html(q.s)}</div><div class="dy">${[[true, "Doğru"], [false, "Yanlış"]].map(([v, ad]) => `<div class="sik ${v === q.c ? "dogru" : v === sec ? "senin" : ""}">${ad}</div>`).join("")}</div>`;
    } else {
      let m = 0;
      g += `<div class="soru-metin">${html(q.s).replace(/____/g, () => `<span class="tu-bosluk">${html(q.cs[m++] || "")}</span>`)}</div>`;
      if (sec && sec.some(v => v)) g += `<div class="tu-senin">Senin cevabın: <b>${sec.map(v => v || "—").join(" · ")}</b></div>`;
    }
    g += aciklamaKutu(x, q, d) + `<button class="tu-link" data-coz="${n}">Bu soruyu yeniden çöz ›</button></article>`;
    h += g;
  });
  ICERIK.innerHTML = h;
  document.getElementById("sonucaDon").onclick = () => { A.mod = "sonuc"; testCiz(); window.scrollTo({ top: 0 }); };
  ICERIK.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { A.incFiltre = b.dataset.f; testCiz(); });
  ICERIK.querySelectorAll("[data-coz]").forEach(b => b.onclick = () => {
    const x = A.liste[+b.dataset.coz];
    delete A.durum[x.key]; delete A.durum["_" + x.key]; delete A.durum["g" + x.key];
    A.filtre = null; A.bitti = false; A.mod = "coz"; A.i = +b.dataset.coz; kaydet(); testCiz(); window.scrollTo({ top: 0 });
  });
}

/* Prova/deneme ekranının kullandığı eski geri bildirim kutusu (değişmedi) */
function aciklamaHtml(iyi, dogruMetin, a, gosterildi) {
  if (gosterildi) return `<div class="aciklama kotu">Cevap: <b>${dogruMetin}</b>${a ? " " + html(a) : ""}</div>`;
  return `<div class="aciklama ${iyi ? "iyi" : "kotu"}"><b>${iyi ? "Doğru!" : "Yanlış."}</b>${!iyi && dogruMetin ? ` Doğru cevap: <b>${dogruMetin}</b>.` : ""}${a ? " " + html(a) : ""}</div>`;
}
/* Açıklama kutusu: yalnızca veride olan doğru cevap ve açıklama gösterilir */
function aciklamaKutu(x, q, d) {
  if (!q.a) return "";
  return `<div class="tu-aciklama"><span class="tu-etiket">Açıklama</span>${html(q.a)}</div>`;
}

/* Boşluk doldurma kelime havuzu */
function havuzHtml() {
  return `<div class="havuz cam"><div class="havuz-baslik">Kelime havuzu · boşluğa yerleştirmek için dokun</div><div class="kelimeler">${
    A.havuz.map(x => {
      const kullanildi = A.durum["bosluk" + x.q] !== undefined;
      return `<button class="kelime ${kullanildi ? "kullanildi" : ""}" data-c="${duz(x.c).replace(/"/g, "&quot;")}" ${kullanildi ? "disabled" : ""}>${html(x.c)}</button>`;
    }).join("")}</div></div>`;
}
let sonOdak = null;
function kelimeKoy(c) {
  const girisler = [...document.querySelectorAll("#soru .bosluk-giris:not([disabled])")];
  if (!girisler.length) return;
  const hedef = (sonOdak && girisler.includes(sonOdak) && !sonOdak.value) ? sonOdak : (girisler.find(g => !g.value) || sonOdak || girisler[0]);
  hedef.value = c;
  const snr = girisler.find(g => !g.value);
  if (snr) { snr.focus(); sonOdak = snr; }
}

function geriBildirim(iyi, dogruMetin, q, gosterildi) {
  const bas = gosterildi ? `<b>Cevap gösterildi.</b> Doğru cevap: <b>${dogruMetin}</b>`
    : iyi ? `<b>Harika! Doğru cevap verdin.</b>` : `<b>Bu cevap doğru değil.</b> Doğru ${dogruMetin.length <= 2 ? "seçenek" : "cevap"}: <b>${dogruMetin}</b>`;
  return `<div class="tu-geri ${iyi ? "iyi" : "kotu"}" role="status">${bas}</div>${q.a ? `<div class="tu-aciklama"><span class="tu-etiket">Açıklama</span>${html(q.a)}</div>` : ""}`;
}

/* Alttaki ana düğmenin durumu: Boş bırak → Kontrol et → Sonraki soru / Testi bitir */
function anaGuncelle() {
  const b = document.getElementById("anaBtn"); if (!b) return;
  const l = aktifListe(), x = l[A.i], cozuldu = A.durum[x.key] !== undefined;
  const sonSoru = A.i === l.length - 1 && !l.some((y, n) => n !== A.i && A.durum[y.key] === undefined);
  let secildi = A.secim[x.key] !== undefined;
  if (x.k === "bosluk" && !cozuldu) secildi = [...document.querySelectorAll("#soru .bosluk-giris")].some(g => g.value.trim());
  b.classList.toggle("ikincil", !cozuldu && !secildi);
  b.textContent = cozuldu ? (sonSoru ? "Sonucu gör" : "Sonraki soru ›") : secildi ? "Kontrol et" : (sonSoru ? "Boş bırak ve bitir" : "Boş bırak ›");
  b.onclick = () => {
    if (cozuldu) return sonraki(false);
    if (secildi) return kontrolEt();
    sonraki(true);
  };
}

let kontrolEt = () => {};
function soruCiz() {
  const l = aktifListe(), x = l[A.i], k = x.k, q = A.u.test[k][x.j], ana = x.key;
  const el = document.getElementById("soru");
  const durum = A.durum[ana], cozuldu = durum !== undefined, sec = cozuldu ? A.durum["_" + ana] : A.secim[ana];
  let h = `<div class="tu-soru-ust"><span class="soru-no">Soru ${A.i + 1}</span>${A.sekmeler.length > 1 ? `<span class="tu-tur">${TUR_AD[k]}</span>` : ""}</div>`;
  const bitir = (iyi, secim, gosterildi) => {
    if (A.durum[ana] !== undefined) return; // aynı soruya ikinci cevap gönderilemez
    A.durum[ana] = iyi; A.durum["_" + ana] = secim;
    if (gosterildi) A.durum["g" + ana] = true;
    delete A.secim[ana];
    kaydet(); testCiz();
  };
  if (k === "test" || k === "dy") {
    const ops = k === "test" ? q.o.map((o, j) => [j, "ABCDE"[j], html(o)]) : [[true, "D", "Doğru"], [false, "Y", "Yanlış"]];
    h += `<div class="soru-metin" id="soruMetin">${html(q.s)}</div><div class="${k === "test" ? "siklar" : "dy"}" role="radiogroup" aria-labelledby="soruMetin">`;
    ops.forEach(([v, harf, ad]) => {
      const dogruMu = v === q.c;
      const cls = cozuldu ? (dogruMu ? "dogru" : v === sec ? "yanlis" : "soluk") : v === sec ? "secili" : "";
      h += `<button class="sik ${cls}" role="radio" aria-checked="${v === sec}" ${cozuldu ? "disabled" : ""} data-v="${v}">${k === "test" ? `<span class="harf">${harf}</span>` : ""}<span>${ad}</span></button>`;
    });
    h += `</div>`;
    if (cozuldu) h += geriBildirim(durum, k === "test" ? "ABCDE"[q.c] + ") " + html(q.o[q.c]) : (q.c ? "Doğru" : "Yanlış"), q);
    el.innerHTML = h;
    kontrolEt = () => { const s = A.secim[ana]; if (s === undefined) return; bitir(s === q.c, s); };
    if (!cozuldu) el.querySelectorAll(".sik").forEach(b => b.onclick = () => {
      const v = k === "test" ? +b.dataset.v : b.dataset.v === "true";
      A.secim[ana] = v;
      el.querySelectorAll(".sik").forEach(s => { const on = s === b; s.classList.toggle("secili", on); s.setAttribute("aria-checked", on); });
      anaGuncelle();
    });
  } else {
    const yazilan = sec || [];
    let n = 0;
    const metin = html(q.s).replace(/____/g, () => {
      const j = n++;
      const cls = cozuldu ? (boslukTekDogru(q, yazilan, j) ? "dogru" : "yanlis") : "";
      const gen = Math.min(Math.max(duz(q.cs[j] || "").length, 6) + 3, 34);
      return `<input class="bosluk-giris ${cls}" style="width:${gen}ch" data-j="${j}" aria-label="Boşluk ${j + 1}" autocomplete="off" autocapitalize="off" spellcheck="false" ${cozuldu ? "disabled" : ""} value="${(yazilan[j] || "").replace(/"/g, "&quot;")}">`;
    });
    h += `<div class="soru-metin">${metin}</div>`;
    if (cozuldu) h += geriBildirim(durum, q.cs.map(html).join(" · "), q, A.durum["g" + ana]);
    else h += `<button class="tu-link" data-is="goster">Cevabı göster</button>`;
    el.innerHTML = h;
    if (!cozuldu) {
      const girisler = [...el.querySelectorAll(".bosluk-giris")];
      girisler.forEach(g => {
        g.addEventListener("focus", () => sonOdak = g);
        g.addEventListener("input", () => { A.secim[ana] = girisler.map(x => x.value); anaGuncelle(); });
        g.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); kontrolEt(); } });
      });
      if (Array.isArray(A.secim[ana])) girisler.forEach((g, j) => g.value = A.secim[ana][j] || "");
      sonOdak = girisler.find(g => !g.value) || girisler[0];
      kontrolEt = () => {
        const bos = girisler.find(g => !g.value.trim());
        if (bos) { bos.focus(); return; }
        bitir(boslukDogru(q, girisler.map(g => g.value)), girisler.map(g => g.value.trim()));
      };
      el.querySelector('[data-is="goster"]').onclick = () => bitir(false, girisler.map(g => g.value.trim()), true);
    }
  }
  anaGuncelle();
}

/* Masaüstü klavye: A–E / 1–5 şık seç, D / Y doğru-yanlış, Enter kontrol/sonraki, ← → gezin */
document.addEventListener("keydown", e => {
  if (!A || A.mod !== "coz" || !document.getElementById("soru") || document.querySelector(".pv-modal")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const yaziyor = e.target && /INPUT|TEXTAREA/.test(e.target.tagName);
  if (yaziyor) return;
  const tus = e.key.toLocaleUpperCase("tr");
  const siklar = [...document.querySelectorAll("#soru .sik:not([disabled])")];
  if (e.key === "Enter" && (e.target === document.body || e.target.classList.contains("sik") || e.target.id === "soru")) { e.preventDefault(); document.getElementById("anaBtn").click(); return; }
  if (e.key === "ArrowRight") { git(A.i + 1); return; }
  if (e.key === "ArrowLeft") { git(A.i - 1); return; }
  if (!siklar.length) return;
  let n = "ABCDE".indexOf(tus); if (n < 0) n = "12345".indexOf(e.key);
  if (siklar.length === 2 && (tus === "D" || tus === "Y")) n = tus === "D" ? 0 : 1;
  if (n >= 0 && siklar[n]) { e.preventDefault(); siklar[n].click(); siklar[n].focus(); }
});

/* Sırasız cevaplarda (ör. SUM(Adet * BirimFiyat)) boşluklar yer değiştirebilir */
function boslukDogru(q, degerler) {
  if (!q.sirasiz) return degerler.every((v, j) => eslesir(v, q.cs[j]));
  const kalan = q.cs.slice();
  return degerler.every(v => { const i = kalan.findIndex(c => eslesir(v, c)); if (i < 0) return false; kalan.splice(i, 1); return true; });
}
function boslukTekDogru(q, degerler, j) {
  return q.sirasiz ? q.cs.some(c => eslesir(degerler[j] || "", c)) : eslesir(degerler[j] || "", q.cs[j]);
}

/* Esnek karşılaştırma: büyük/küçük harf, Türkçe karakter, boşluk ve noktalama farkını
   önemsemez; parantez içindeki kısaltmayı ya da parantezsiz hâlini de kabul eder. */
function sade(s) {
  return duz(s).toLocaleLowerCase("tr")
    .replace(/[ıi̇]/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[âä]/g, "a")
    .replace(/[^a-z0-9%.*]/g, "").replace(/\./g, "");
}
function eslesir(yazilan, cevap) {
  let y = sade(yazilan);
  if (/^\d+$/.test(y) && /^\d+$/.test(sade(cevap))) return y.replace(/^0+(?=\d)/, "") === sade(cevap).replace(/^0+(?=\d)/, "");
  if (!y) return false;
  const ic = (cevap.match(/\((.*?)\)/g) || []).map(x => x.slice(1, -1));
  const adaylar = [cevap, cevap.replace(/\(.*?\)/g, ""), ...ic, ...ic.flatMap(x => x.split("/"))];
  return adaylar.some(a => sade(a) && sade(a) === y);
}

/* ===================== PROVA / DENEME ===================== */
const ikonSinav = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zM9 12l2 2 4-4M9 18h6"/></svg>';
const pvDevam = id => "kc-pv:" + dersYolu + ":" + id;
const pvGecmisK = id => "kc-pvs:" + dersYolu + ":" + id;
let P = null, pvZaman = null;
const dkSn = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

function pvTanim(id) {
  const p = (ders.provalar || []).find(x => x.id === id);
  if (p) return { ...p, tur: "prova", adet: (p.sorular || []).length, puan: p.puan || 100 / p.sorular.length };
  const d = (ders.denemeler || []).find(x => x.id === id);
  if (d) return { ...d, tur: "deneme", puan: 100 / d.adet };
  return null;
}
function pvSorular(t) {
  if (t.tur === "prova") return t.sorular.map(q => ({ ...q, b: +((q.a || "").match(/\(Bölüm (\d+)\)/) || [])[1] || 0 }));
  const havuz = ders.uniteler.filter(u => t.bolumler.includes(u.no) && u.test).flatMap(u => (u.test.test || []).map(q => ({ ...q, b: u.no })));
  return karistir(havuz).slice(0, t.adet);
}
const pvOnek = t => t.tur === "prova" ? "prova" : "deneme";

/* Liste kartları */
/* Prova PDF'i: dosya adı ve aç/indir butonları */
const pvDosya = x => "KampusCepte-" + (ders.ad || "ders").replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü]+/g, "-") + "-" + x.ad.replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü]+/g, "-") + ".pdf";
const pvPdfButon = (x, anaAc) => x.pdf ? `<div class="butonlar pv-pdf">
    <a class="btn${anaAc ? " ana" : ""}" href="${klasor + x.pdf}" target="_blank" rel="noopener">${ikonPdf}PDF'i aç</a>
    <a class="btn" href="${klasor + x.pdf}" download="${pvDosya(x)}">${ikonIndir}PDF indir</a></div>` : "";
function pvKart(x, sinif) {
  const t = pvTanim(x.id), g = oku(pvGecmisK(x.id)) || [], dv = oku(pvDevam(x.id));
  const en = g.length ? Math.max(...g.map(r => r.puan)) : null;
  const sadecePdf = !t.adet;
  const ust = `<div class="pv-kart-ust"><span class="pv-ikon ${sinif}">${ikonSinav}</span>
    <div style="min-width:0"><h3>${x.ad}${dv && !dv.bitti ? '<span class="pv-rozet" style="background:var(--turuncu-acik);color:#9a4a12">Devam ediyor</span>' : en !== null ? `<span class="pv-rozet">En iyi ${Math.round(en)}</span>` : ""}</h3>
    <div class="meta">${x.konu} · ${sadecePdf ? "PDF · çözümlü" : `${t.adet} soru · ${t.sure} dk`}</div></div></div>`;
  return `<div class="pv-kart cam${x.pdf ? " pdfli" : ""}">
    <a class="pv-kart-link" href="${sadecePdf ? klasor + x.pdf : `#${pvOnek(t)}-${x.id}`}"${sadecePdf ? ' target="_blank" rel="noopener"' : ""}>${ust}</a>
    ${pvPdfButon(x, false)}</div>`;
}
function pvProvaHtml() {
  let h = "";
  [["vize", "Vize provaları", "vize"], ["final", "Final provası", "final"]].forEach(([on, bas, sn]) => {
    const l = (ders.provalar || []).filter(x => x.id.startsWith(on));
    if (l.length) h += `<div class="baslik">${bas}</div><div class="pv-kartlar">${l.map(x => pvKart(x, sn)).join("")}</div>`;
  });
  return h || '<div class="cam hata">Prova yok.</div>';
}
function pvDenemeHtml() {
  const l = ders.denemeler || [];
  return `<div class="baslik">Karışık denemeler <small style="font-weight:600;color:var(--soluk)">her açılışta farklı sorular</small></div><div class="pv-kartlar">${l.map(x => pvKart(x, "karma")).join("")}</div>`;
}

/* Giriş ekranı */
function pvGiris(id) {
  const t = pvTanim(id), g = oku(pvGecmisK(id)) || [], dv = oku(pvDevam(id));
  P = null;
  let h = `<a class="geri" href="#" onclick="event.preventDefault(); listeyeDon();">‹ ${ders.ad}</a>
    <section class="ust-bilgi" style="margin-top:6px"><small>${t.tur === "prova" ? "Sınav provası" : "Karışık deneme"}</small><h1>${t.ad}</h1><p class="yazar">${t.konu}</p></section>
    <div class="pv-bilgi"><div><b>${t.adet}</b>soru</div><div><b>${t.sure}</b>dakika</div><div><b>${Math.round(t.puan * 100) / 100}</b>puan / soru</div></div>
    ${pvPdfButon(t, false)}`;
  if (dv && !dv.bitti) {
    const kalan = dv.bitis ? dv.bitis - Date.now() : null;
    h += `<div class="pv-devam"><div>Yarım kalan bir denemen var (${dv.cevap.filter(x => x !== null).length}/${dv.sorular.length} cevaplı${kalan !== null ? kalan > 0 ? ` · ${dkSn(kalan)} kaldı` : " · süre doldu" : ""}).</div>
      <div class="butonlar"><button class="btn ana" id="pvSurdur">Devam et</button><button class="btn" id="pvSil">Vazgeç</button></div></div>`;
  }
  h += `<div class="pv-mod">
      <label><input type="radio" name="mod" value="sinav" checked><span><b>Sınav modu</b><small>${t.sure} dakika süre, cevaplar sonda açıklanır. Soruları işaretleyip geri dönebilirsin. Gerçek sınav gibi.</small></span></label>
      <label><input type="radio" name="mod" value="calisma"><span><b>Çalışma modu</b><small>Süre yok. Her soruyu işaretleyince doğru cevap ve açıklama hemen görünür.</small></span></label></div>
    <button class="btn ana pv-basla" id="pvBasla">${t.tur === "prova" ? "Provayı başlat" : "Denemeyi başlat"}</button>`;
  if (g.length) h += `<div class="baslik" style="margin-top:22px">Önceki denemelerin</div><div class="pv-gecmis">${g.slice().reverse().map(r => `<span>${Math.round(r.puan)} puan · ${r.d}D ${r.y}Y ${r.b}B</span>`).join("")}</div>`;
  h += `<div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  const mod = () => document.querySelector('input[name="mod"]:checked').value;
  document.getElementById("pvBasla").onclick = () => pvBaslat(t, mod());
  if (dv && !dv.bitti) {
    document.getElementById("pvSurdur").onclick = () => { P = dv; pvCiz(); };
    document.getElementById("pvSil").onclick = () => { try { localStorage.removeItem(pvDevam(id)); } catch (e) {} pvGiris(id); };
  }
}

function pvBaslat(t, mod) {
  const sorular = pvSorular(t);
  P = { id: t.id, ad: t.ad, tur: t.tur, mod, sorular, cevap: sorular.map(() => null), isaret: sorular.map(() => false), i: 0,
        puan: t.puan, sure: t.sure, bitis: mod === "sinav" ? Date.now() + t.sure * 60000 : null, basla: Date.now(), bitti: false };
  pvKaydet(); pvCiz();
}
function pvKaydet() { if (P && P.id !== "tekrar") yaz(pvDevam(P.id), P); }

/* Çözüm ekranı */
function pvCiz() {
  clearInterval(pvZaman);
  if (P.bitti) return pvSonuc();
  if (P.bitis && P.bitis <= Date.now()) return pvBitir(true);
  const n = P.sorular.length, i = P.i, q = P.sorular[i], c = P.cevap[i], sinav = P.mod === "sinav";
  const cevapli = P.cevap.filter(x => x !== null).length;
  let h = `<a class="geri" href="#" onclick="event.preventDefault(); clearInterval(pvZaman); listeyeDon();">‹ Çıkış (ilerlemen kayıtlı)</a>
    <div class="pv-ust cam">
      <div class="pv-sure" id="pvSure">${sinav ? "⏱ " + dkSn(P.bitis - Date.now()) : "Çalışma"}</div>
      <div class="pv-ilerle"><i style="width:${Math.round(cevapli / n * 100)}%"></i></div>
      <button class="pv-bitir" id="pvBitir">Bitir</button>
    </div>
    <article class="pv-soru cam"><div class="pv-soru-ust"><div class="soru-no">Soru ${i + 1} / ${n}</div>
      ${sinav ? `<button class="pv-isaret ${P.isaret[i] ? "acik" : ""}" id="pvIsaret">${P.isaret[i] ? "⚑ İşaretli" : "⚐ İşaretle"}</button>` : ""}</div>
      <div class="soru-metin">${html(q.s)}</div><div class="siklar">`;
  q.o.forEach((o, j) => {
    let cls = "";
    if (sinav) cls = c === j ? "secili" : "";
    else if (c !== null) cls = j === q.c ? "dogru" : j === c ? "yanlis" : "";
    h += `<button class="sik ${cls}" data-k="${j}" ${!sinav && c !== null ? "disabled" : ""}><span class="harf">${"ABCDE"[j]}</span><span>${html(o)}</span></button>`;
  });
  h += `</div>`;
  if (!sinav && c !== null) h += aciklamaHtml(c === q.c, `${"ABCDE"[q.c]}) ${html(q.o[q.c])}`, q.a);
  h += `</article>
    <div class="gezinme"><button class="btn" id="pvGeri" ${i === 0 ? "disabled" : ""}>‹ Önceki</button>
    <button class="btn ana" id="pvIleri">${i < n - 1 ? "Sonraki ›" : "Bitir ›"}</button></div>
    <div class="pv-izgara">${P.sorular.map((x, j) => {
      const d = P.cevap[j];
      const cls = sinav ? (d !== null ? "cevapli" : "") : (d === null ? "" : d === x.c ? "dogru" : "yanlis");
      return `<button class="${cls} ${j === i ? "su-an" : ""} ${P.isaret[j] ? "isaretli" : ""}" data-git="${j}">${j + 1}</button>`;
    }).join("")}</div>
    <div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  ICERIK.querySelectorAll(".siklar .sik").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (sinav) P.cevap[i] = P.cevap[i] === k ? null : k; else P.cevap[i] = k;
    pvKaydet(); pvCiz();
  });
  ICERIK.querySelectorAll("[data-git]").forEach(b => b.onclick = () => { P.i = +b.dataset.git; pvKaydet(); pvCiz(); window.scrollTo({ top: 0 }); });
  document.getElementById("pvGeri").onclick = () => { P.i--; pvKaydet(); pvCiz(); window.scrollTo({ top: 0 }); };
  document.getElementById("pvIleri").onclick = () => { if (i < n - 1) { P.i++; pvKaydet(); pvCiz(); window.scrollTo({ top: 0 }); } else pvBitirSor(); };
  document.getElementById("pvBitir").onclick = pvBitirSor;
  const is = document.getElementById("pvIsaret");
  if (is) is.onclick = () => { P.isaret[i] = !P.isaret[i]; pvKaydet(); pvCiz(); };
  if (sinav) {
    pvZaman = setInterval(() => {
      const kalan = P.bitis - Date.now(), el = document.getElementById("pvSure");
      if (kalan <= 0) { clearInterval(pvZaman); pvBitir(true); return; }
      if (el) { el.textContent = "⏱ " + dkSn(kalan); el.classList.toggle("az", kalan < 5 * 60000); }
    }, 1000);
  }
}

function pvBitirSor() {
  const bos = P.cevap.filter(x => x === null).length, isr = P.isaret.filter(Boolean).length;
  const m = document.createElement("div");
  m.className = "pv-modal";
  m.innerHTML = `<div><h3>${P.mod === "sinav" ? "Sınavı bitirelim mi?" : "Çalışmayı bitirelim mi?"}</h3>
    <p>${bos ? `<b>${bos}</b> soru boş.` : "Tüm soruları cevapladın."}${isr ? ` <b>${isr}</b> soru işaretli.` : ""} Bitirdikten sonra cevaplarını değiştiremezsin.</p>
    <div class="butonlar"><button class="btn" id="mDevam">Devam et</button><button class="btn ana" id="mBitir">Bitir</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#mDevam").onclick = () => m.remove();
  m.querySelector("#mBitir").onclick = () => { m.remove(); pvBitir(false); };
}

function pvBitir(sureDoldu) {
  clearInterval(pvZaman);
  P.bitti = true; P.sureDoldu = !!sureDoldu; P.bitisZ = Date.now();
  const s = pvSay();
  if (P.id !== "tekrar") {
    const g = oku(pvGecmisK(P.id)) || [];
    g.push({ t: Date.now(), d: s.d, y: s.y, b: s.b, puan: s.d * P.puan });
    yaz(pvGecmisK(P.id), g.slice(-8));
    try { localStorage.removeItem(pvDevam(P.id)); } catch (e) {}
  }
  pvSonuc();
}
function pvSay() {
  let d = 0, y = 0, b = 0;
  P.sorular.forEach((q, i) => { const c = P.cevap[i]; if (c === null) b++; else if (c === q.c) d++; else y++; });
  return { d, y, b };
}

/* Sonuç + inceleme */
let pvFiltre = "hepsi";
function pvSonuc() {
  const s = pvSay(), n = P.sorular.length, puan = Math.round(s.d * P.puan * 10) / 10, oran = s.d / n;
  const sureMs = Math.min(P.bitisZ || Date.now(), P.bitis || Infinity) - P.basla;
  const renk = oran >= .7 ? "var(--yesil)" : oran >= .5 ? "var(--turuncu)" : "var(--pembe)";
  const yorum = P.sureDoldu ? "Süre doldu. " : "";
  const metin = oran >= .85 ? "Harika, sınava hazırsın!" : oran >= .7 ? "Güzel sonuç. Yanlışlarına bir göz at." : oran >= .5 ? "Fena değil, eksik konuları tekrar edelim." : "Konuları tekrar okuyup yeniden dene, olur.";
  // zayıf bölümler
  const zayif = {};
  P.sorular.forEach((q, i) => { if (P.cevap[i] !== q.c && q.b) zayif[q.b] = (zayif[q.b] || 0) + 1; });
  const zl = Object.entries(zayif).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([no, k]) => ({ u: ders.uniteler.find(x => x.no === +no), k })).filter(x => x.u);
  const hata = s.y + s.b;
  let h = `<a class="geri" href="#" onclick="event.preventDefault(); listeyeDon();">‹ ${ders.ad}</a>
    <section class="pv-sonuc cam">
      <div class="pv-halka" style="--p:${Math.round(oran * 100)};--renk:${renk}"><div><b>${puan}</b><small>/ ${Math.round(P.puan * n)} puan</small></div></div>
      <h2>${P.ad}</h2><p>${yorum}${metin}</p>
      <div class="pv-say"><div class="d"><b>${s.d}</b>Doğru</div><div class="y"><b>${s.y}</b>Yanlış</div><div><b>${s.b}</b>Boş</div><div><b>${dkSn(sureMs)}</b>Süre</div></div>
      ${zl.length ? `<div class="pv-zayif"><h4>Tekrar etmen gereken bölümler</h4>${zl.map(x => `<a href="#test-${x.u.no}"><div>${x.u.no}. ${x.u.ad}</div><span>${x.k} hata</span></a>`).join("")}</div>` : ""}
      <div class="butonlar" style="justify-content:center">
        ${hata ? `<button class="btn ana" id="pvTekrar">Yanlışları tekrar çöz (${hata})</button>` : ""}
        ${P.id !== "tekrar" ? `<button class="btn" id="pvYeni">Yeniden dene</button>` : ""}
      </div>
    </section>
    <div class="baslik">Soruları incele</div>
    <div class="pv-filtre">${[["hepsi", "Tümü", n], ["yanlis", "Yanlış", s.y], ["bos", "Boş", s.b], ["dogru", "Doğru", s.d], ["isaret", "İşaretli", P.isaret.filter(Boolean).length]].map(([k, ad, c]) => `<button data-f="${k}" class="${pvFiltre === k ? "aktif" : ""}">${ad} ${c}</button>`).join("")}</div>`;
  P.sorular.forEach((q, i) => {
    const c = P.cevap[i], durum = c === null ? "bos" : c === q.c ? "dogru" : "yanlis";
    if (pvFiltre === "isaret" ? !P.isaret[i] : pvFiltre !== "hepsi" && pvFiltre !== durum) return;
    h += `<article class="pv-inc cam"><div class="durum">Soru ${i + 1}<i class="${durum === "dogru" ? "d" : durum === "yanlis" ? "y" : "b"}">${durum === "dogru" ? "Doğru" : durum === "yanlis" ? "Yanlış" : "Boş"}</i>${P.isaret[i] ? "⚑" : ""}</div>
      <div class="soru-metin">${html(q.s)}</div><div class="siklar">${q.o.map((o, j) => `<div class="sik ${j === q.c ? "dogru" : j === c ? "senin" : ""}"><span class="harf">${"ABCDE"[j]}</span><span>${html(o)}</span></div>`).join("")}</div>
      ${q.a ? `<div class="aciklama iyi"><b>Açıklama:</b> ${html(q.a)}</div>` : ""}</article>`;
  });
  h += `<div class="vitrin">Sponsorlu alan</div>`;
  ICERIK.innerHTML = h;
  ICERIK.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { pvFiltre = b.dataset.f; pvSonuc(); });
  const tk = document.getElementById("pvTekrar");
  if (tk) tk.onclick = () => {
    const idx = P.sorular.map((q, i) => i).filter(i => P.cevap[i] !== P.sorular[i].c);
    const sorular = idx.map(i => P.sorular[i]);
    P = { id: "tekrar", ad: "Yanlışlarım", tur: "tekrar", mod: "calisma", sorular, cevap: sorular.map(() => null), isaret: sorular.map(() => false), i: 0, puan: 100 / sorular.length, bitis: null, basla: Date.now(), bitti: false };
    pvFiltre = "hepsi"; pvCiz(); window.scrollTo({ top: 0 });
  };
  const yn = document.getElementById("pvYeni");
  if (yn) yn.onclick = () => pvGiris(P.id);
}


yukle();
</script>
