<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--yazi); background: var(--zemin); -webkit-font-smoothing: antialiased; }
.isik { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(520px 380px at 90% 0%, rgba(255,170,110,.45), transparent 70%),
              radial-gradient(600px 460px at -5% 25%, rgba(120,150,255,.40), transparent 70%),
              radial-gradient(520px 420px at 80% 100%, rgba(90,220,170,.30), transparent 70%), var(--zemin); }
.cam { background: var(--cam); border: 1px solid var(--cam-kenar); border-radius: var(--r-3); box-shadow: var(--golge);
  }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
.ust { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--yazi); text-decoration: none; }
.logo-ikon { width: 34px; height: 34px; border-radius: var(--r-2); display: grid; place-items: center;
  background: var(--mavi); color: #fff; font-weight: 700; }
.site-btn { border: 0; background: #fff; color: var(--mavi); font: 700 13px var(--font); padding: 9px 14px; border-radius: var(--r-2);
  text-decoration: none; box-shadow: var(--golge); white-space: nowrap; }
h1 { font-size: 26px; letter-spacing: -.5px; margin: 0 0 4px; }
.alt { color: var(--soluk); font-weight: 600; font-size: 14px; margin: 0 0 16px; }
.gun-sec { display: grid; grid-template-columns: 1fr 1fr; background: color-mix(in srgb,var(--yazi) 5%,transparent); border-radius: var(--r-2); padding: 4px; margin-bottom: 16px; }
.gun-sec button { border: 0; background: transparent; color: var(--soluk); font: 700 14px var(--font); padding: 10px; border-radius: var(--r-1); cursor: pointer; }
.gun-sec button.aktif { background: #fff; color: var(--yazi); box-shadow: var(--golge); }
.kart { padding: 18px 20px; margin-bottom: 14px; }
.kart-ust h2 .saat { display: block; font-size: 12.5px; font-weight: 700; color: var(--soluk); margin-top: 2px; letter-spacing: 0; }
.kart-ust { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.kart h2 { font-size: 17px; margin: 0; }
.etiket { font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: var(--r-1); }
.etiket.turuncu { background: var(--turuncu-acik); color: var(--turuncu); }
.etiket.mavi { background: var(--mavi-acik); color: var(--mavi); }
.yemekler { list-style: none; margin: 0; padding: 0; }
.yemekler li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--cizgi); font-weight: 600; font-size: 15px; }
.yemekler li:last-child { border-bottom: 0; }
.yemekler li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--turuncu); flex: none; }
.yemekler li.not, .yemekler li.bos { color: var(--soluk); font-size: 13px; }
.yemekler li.not::before, .yemekler li.bos::before { display: none; }
.kesfet h2 { margin-bottom: 12px; }
.kisayol { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kisayol a { display: block; background: #fff; border-radius: var(--r-2); padding: 14px; text-decoration: none; color: var(--yazi);
  font-weight: 700; font-size: 14px; border: 1px solid var(--cizgi); }
.kisayol a img { display: block; width: 56px; height: 56px; margin: -4px 0 6px -4px; animation: kc-yuz 3s ease-in-out infinite; }
.kisayol a:nth-child(2) img { animation-delay: .4s; } .kisayol a:nth-child(3) img { animation-delay: .8s; } .kisayol a:nth-child(4) img { animation-delay: 1.2s; }
@media (prefers-reduced-motion: reduce) { .kisayol a img { animation: none; } }
.kisayol a small { display: block; color: var(--soluk); font-weight: 600; font-size: 12px; margin-top: 2px; }
.kaynak { color: var(--soluk); font-size: 12px; margin: 10px 0 0; }
.kaynak a { color: inherit; }
footer { text-align: center; color: var(--soluk); font-size: 12px; margin-top: 20px; }
footer a { color: inherit; }
.baslik-g { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.baslik-g img { width: 110px; height: auto; flex: none; }
.baslik-g img.yurt-b { width: 170px; animation: none; filter: drop-shadow(0 8px 14px rgba(40,60,140,.14)); }
@media (max-width: 420px) { .baslik-g img.yurt-b { width: 140px; } }

/* ================= HAREKET ================= */
@keyframes kc-yuz { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-2deg); } }
@keyframes kc-gir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes kc-nokta { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,138,61,.45); } 50% { transform: scale(1.15); box-shadow: 0 0 0 5px rgba(255,138,61,0); } }
.yemekler li { animation: kc-gir .45s ease both; }
.yemekler li:nth-child(2) { animation-delay: .06s; } .yemekler li:nth-child(3) { animation-delay: .12s; }
.yemekler li:nth-child(4) { animation-delay: .18s; } .yemekler li:nth-child(5) { animation-delay: .24s; }
.yemekler li:nth-child(6) { animation-delay: .30s; } .yemekler li:nth-child(7) { animation-delay: .36s; }
.yemekler li:nth-child(8) { animation-delay: .42s; } .yemekler li:nth-child(n+9) { animation-delay: .48s; }
.yemekler li::before { animation: kc-nokta 2.4s ease-in-out infinite; }
.yemekler li:nth-child(2n)::before { animation-delay: .6s; } .yemekler li:nth-child(3n)::before { animation-delay: 1.2s; }
.baslik-g img { animation: kc-yuz 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .yemekler li, .yemekler li::before, .gorselli img, .kutu .resim, .afis img, .baslik-g img, .kapak { animation: none !important; } }

.etiket.mor{background:rgba(139,92,246,.13);color:#7c4ddb}

.ara-ek:empty{display:none}

/* Yorumlar kapalı: yalnızca yıldız, beğeni ve bakan kişi sayısı */
.degerlendir .dg-btn.yorum,.degerlendir .dg-panel{display:none!important}
/* Gelecek günler düğmesi ve modal (ana sayfadakiyle aynı) */
.aylik-btn{width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1.5px solid var(--mavi);color:var(--mavi);border-radius:var(--r-hap);font:800 15px var(--font);padding:12px 16px;background:var(--kart);transition:background-color .15s,color .15s}
.aylik-btn:hover{background:var(--mavi);color:var(--vurgu-yazi)}
.modal-perde{position:fixed;inset:0;z-index:100;background:rgba(15,23,40,.5);display:none;align-items:center;justify-content:center;padding:16px;animation:modalAc .2s ease}
.modal-perde.aktif{display:flex}
@keyframes modalAc{from{opacity:0}to{opacity:1}}
.modal-kutu{background:var(--kart);border:1px solid var(--cam-kenar);border-radius:var(--r-4);box-shadow:var(--golge-ust);width:100%;max-width:600px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;animation:modalYuksel .25s cubic-bezier(.16,1,.3,1)}
@keyframes modalYuksel{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-ust{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--cizgi);background:var(--kart);flex:none}
.modal-ust h3{margin:0;font-size:19px;font-weight:700}
.modal-ust p{margin:2px 0 0;font-size:12.5px;color:var(--soluk);font-weight:500}
.modal-kapat{width:36px;height:36px;border-radius:var(--r-2);border:0;background:var(--kart-2);color:var(--yazi);font-size:20px;font-weight:500;cursor:pointer;display:grid;place-items:center}
.modal-icerik{padding:12px 0 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;flex:none;height:min(560px,calc(85vh - 92px))}
.kb-sekme{display:flex;gap:4px;margin:0 20px;padding:3px;border-radius:var(--r-2);background:var(--kart-2)}
.kb-sekme button{flex:1;border:0;border-radius:7px;padding:9px 4px;font:600 13px var(--font);background:transparent;color:var(--soluk);cursor:pointer;transition:all .2s}
.kb-sekme button.aktif{background:var(--kart);color:var(--yazi);box-shadow:0 0 0 1px var(--cam-kenar)}
.kb-ust{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.kb-say{font-weight:700;font-size:13px;color:var(--soluk)}
.kb-say b{color:var(--mavi);font-size:16px}
.kb-ok{width:38px;height:38px;border-radius:var(--r-2);border:1px solid var(--cam-kenar);background:var(--kart);color:var(--yazi);font-size:24px;line-height:1;cursor:pointer}
.kb-ok:disabled{opacity:.3;cursor:default}
.kb-iz{display:flex;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.kb-iz::-webkit-scrollbar{display:none}
.kb-sayfa{flex:0 0 100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always;padding:4px 20px 6px;box-sizing:border-box;display:flex}
.kb-kart{flex:1;min-width:0;overflow-y:auto;border-radius:var(--r-3);padding:18px 18px 20px;background:var(--kart);border:1px solid var(--cam-kenar)}
.kb-baslik{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--cizgi)}
.kb-no{font:700 44px/1 var(--font-b);color:var(--yazi);letter-spacing:-.04em;min-width:52px}
.kb-tarih{display:flex;flex-direction:column;flex:1;min-width:0}
.kb-tarih b{font-family:var(--font-b);font-size:17px;font-weight:700;text-transform:capitalize}
.kb-tarih span{font-size:13px;font-weight:600;color:var(--soluk);text-transform:capitalize}
.aylik-ogun-bloku{margin-top:16px}
.aylik-ogun-bloku>b{color:var(--soluk);font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
.aylik-yemek{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--cizgi);font-weight:600;font-size:14.5px;line-height:1.3}
.aylik-yemek:first-of-type{border-top:0}
.aylik-nokta{flex:none;width:8px;height:8px;margin:0 6px 0 2px;border-radius:2px;background:var(--renk,#f59e0b)}
.aylik-not{color:var(--soluk);font-size:12.5px;font-weight:600;margin-top:8px}
.kb-noktalar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 20px;max-height:40px;overflow:hidden}
.kb-noktalar i{width:6px;height:6px;border-radius:2px;background:var(--cizgi);cursor:pointer;transition:all .2s}
.kb-noktalar i.aktif{width:18px;background:var(--mavi)}

const YIL = 2026, AY = 10; /* Kasım */
const OGUN = [["sabah", "Kahvaltı"], ["ogle", "Öğle"], ["ara", "Ara öğün"], ["aksam", "Akşam"]];
const OGUN_TAM = ["Kahvaltı", "Öğle yemeği", "Ara öğün", "Akşam yemeği"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
const ekle = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const anahtar = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const menu = d => (d.getFullYear() === YIL && d.getMonth() === AY) ? AY_VERI[d.getDate() - 1] || null : null;

(function () {
  let disaridan = true;
  try { disaridan = !document.referrer || new URL(document.referrer).origin !== location.origin; } catch (e) {}
  if (!disaridan || !history.pushState) return;
  const buSayfa = location.href, ana = new URL("/", location.href).href;
  history.replaceState({ kc: "ana" }, "", ana);
  history.pushState({ kc: "menu" }, "", buSayfa);
  addEventListener("popstate", e => { if (e.state && e.state.kc === "ana") location.replace(ana); });
})();

let secGun = 0, secOgun = (() => { const h = new Date().getHours(); return h < 11 ? 0 : h < 15 ? 1 : h < 17 ? 2 : 3; })();
function goster(ekGun) {
  if (ekGun != null) secGun = ekGun;
  const d = ekle(bugun, secGun), m = menu(d), k = anahtar(d), o = OGUN[secOgun][0];
  document.querySelectorAll(".gun-sec button").forEach(b => b.classList.toggle("aktif", +b.dataset.g === secGun));
  document.querySelectorAll("#secici button").forEach(b => { const on = +b.dataset.o === secOgun; b.classList.toggle("aktif", on); b.setAttribute("aria-selected", on); });
  document.getElementById("tarih").textContent = d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" }) + " menüsü";
  document.getElementById("liste").innerHTML = m ? m[secOgun].map(y => `<li>${esc(y)}</li>`).join("") : `<li class="bos">Bu günün menüsü henüz eklenmedi.</li>`;
  document.getElementById("liste-ek").textContent = m && secOgun === 0 ? "Sabah ara öğünü: Mevsim meyvesi" : "";
  /* Yıldız, beğeni ve bakan sayısı her öğün için ayrı tutulur: askeri-<öğün>_<tarih> */
  document.getElementById("dg").dataset.menu = m ? `askeri-${o}_${k}` : "";
}
document.querySelectorAll("#secici button").forEach(b => b.onclick = () => { secOgun = +b.dataset.o; goster(); });

/* Gelecek günler: ana sayfadaki gibi kaydırmalı gün kartları, öğün sekmeli */
function kitapKur(el, sayfalar, ilk, sekme) {
  const n = sayfalar.length;
  el.innerHTML = `<div class="kb-sekme">${OGUN.map(([o, ad], i) => `<button type="button" data-k="${i}" class="${i === sekme ? "aktif" : ""}">${ad}</button>`).join("")}</div>
    <div class="kb-ust"><button type="button" class="kb-ok" data-y="-1" aria-label="Önceki gün">‹</button><div class="kb-say"><b class="kb-n">1</b> / ${n}</div><button type="button" class="kb-ok" data-y="1" aria-label="Sonraki gün">›</button></div>
    <div class="kb-iz">${sayfalar.map((h, i) => `<section class="kb-sayfa"><div class="kb-kart">${h}</div></section>`).join("")}</div>
    <div class="kb-noktalar">${sayfalar.map((_, i) => `<i data-i="${i}"></i>`).join("")}</div>`;
  const iz = el.querySelector(".kb-iz"), sayac = el.querySelector(".kb-n");
  const noktalar = [...el.querySelectorAll(".kb-noktalar i")], oklar = [...el.querySelectorAll(".kb-ok")];
  let akt = -1;
  const guncelle = () => {
    const i = Math.max(0, Math.min(n - 1, Math.round(iz.scrollLeft / iz.clientWidth)));
    if (i === akt) return; akt = i;
    sayac.textContent = i + 1;
    noktalar.forEach((x, j) => x.classList.toggle("aktif", j === i));
    oklar[0].disabled = i === 0; oklar[1].disabled = i === n - 1;
  };
  const git = (i, yumusak) => iz.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * iz.clientWidth, behavior: yumusak ? "smooth" : "auto" });
  el.querySelectorAll(".kb-sekme button").forEach(b => b.onclick = () => aylikAc(+b.dataset.k, akt));
  oklar.forEach(b => b.onclick = () => git(akt + +b.dataset.y, true));
  noktalar.forEach(x => x.onclick = () => git(+x.dataset.i, true));
  iz.addEventListener("scroll", guncelle, { passive: true });
  iz.tabIndex = 0;
  iz.onkeydown = e => { if (e.key === "ArrowRight") git(akt + 1, true); if (e.key === "ArrowLeft") git(akt - 1, true); };
  requestAnimationFrame(() => { git(ilk || 0, false); guncelle(); });
}

function aylikAc(ogun, ilk) {
  const icerik = document.getElementById("aylik-icerik");
  document.getElementById("aylik-baslik").textContent = "Gelecek Günlerin Menüsü";
  const gunler = [];
  for (let i = 1; i <= 31; i++) { const d = ekle(bugun, i); if (menu(d)) gunler.push(d); }
  if (!gunler.length) {
    icerik.innerHTML = '<p class="aylik-not" style="padding:0 20px">Bu ay için kalan başka menü bulunmuyor.</p>';
  } else {
    kitapKur(icerik, gunler.map(d => {
      const yarin = +d === +ekle(bugun, 1);
      const rozet = yarin ? '<span class="etiket yesil">Yarın</span>' : "";
      const ay = d.toLocaleDateString("tr-TR", { month: "long" }), gn = d.toLocaleDateString("tr-TR", { weekday: "long" });
      const liste = menu(d)[ogun];
      return `<div class="kb-baslik"><div class="kb-no">${d.getDate()}</div><div class="kb-tarih"><b>${ay}</b><span>${gn}</span></div>${rozet}</div>
        <div class="aylik-ogun-bloku"><b>${OGUN_TAM[ogun]}</b>${liste.map(y => `<div class="aylik-yemek"><span class="aylik-nokta"></span><span>${esc(y)}</span></div>`).join("")}</div>
        ${ogun === 0 ? '<p class="aylik-not">Sabah ara öğünü: Mevsim meyvesi</p>' : ""}`;
    }), ilk || 0, ogun);
  }
  document.getElementById("aylik-modal").classList.add("aktif");
  document.body.style.overflow = "hidden";
}
function aylikKapat() { document.getElementById("aylik-modal").classList.remove("aktif"); document.body.style.overflow = ""; }
document.getElementById("aylik-ac").onclick = () => aylikAc(secOgun, 0);
document.getElementById("aylik-kapat").onclick = aylikKapat;
document.getElementById("aylik-modal").onclick = e => { if (e.target.id === "aylik-modal") aylikKapat(); };
addEventListener("keydown", e => { if (e.key === "Escape") aylikKapat(); });

document.querySelectorAll(".gun-sec button").forEach(b => b.onclick = () => goster(+b.dataset.g));
goster(0);
