<title>Askerî Öğrenci Yemek Listesi · Kasım – KampüsCepte</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--yazi);background:var(--zemin);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
.isik{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 92% -5%,rgba(110,150,90,.38),transparent 70%),radial-gradient(560px 420px at -8% 30%,rgba(120,150,255,.30),transparent 70%),radial-gradient(520px 420px at 80% 105%,rgba(255,170,110,.28),transparent 70%),var(--zemin)}
main{max-width:600px;margin:0 auto;padding:18px 16px 56px}
.ust{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.marka{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--yazi);text-decoration:none;letter-spacing:-.2px}
.marka img{width:30px;height:30px;border-radius:9px}
.rozet{font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#4d6b3c;background:rgba(110,150,90,.16);padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.rozet svg{width:13px;height:13px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.7px;margin:12px 0 6px}
.alt{color:var(--soluk);font-weight:600;font-size:14px;margin:0 0 20px}
.seridi{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.seridi::-webkit-scrollbar{display:none}
.gun{flex:none;scroll-snap-align:center;width:58px;padding:9px 0 10px;border-radius:16px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;cursor:pointer;text-align:center;transition:transform .15s,background .15s}
.gun:active{transform:scale(.96)}
.gun small{display:block;font-size:11px;font-weight:700;color:var(--soluk);text-transform:uppercase;letter-spacing:.3px}
.gun b{display:block;font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.gun.bugun small{color:var(--mavi)}
.gun.aktif{background:var(--yazi);color:var(--zemin);border-color:transparent;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
.gun.aktif small{color:color-mix(in srgb,var(--zemin) 70%,transparent)}
.baslik{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}
.baslik h2{margin:0;font-size:19px;letter-spacing:-.3px}
.baslik h2 span{display:block;font-size:13px;color:var(--soluk);font-weight:600;letter-spacing:0;margin-top:2px}
.oklar{display:flex;gap:8px}
.oklar button{width:40px;height:40px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.oklar button:disabled{opacity:.35;cursor:default}
.ogun{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r-3);box-shadow:var(--golge);padding:16px 18px 8px;margin-bottom:12px;position:relative;overflow:hidden}
.ogun::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--renk)}
.ogun-ust{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ogun-ust h3{margin:0;font-size:16px;display:flex;align-items:center;gap:10px}
.ik{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--renk) 15%,transparent);color:var(--renk)}
.ik svg{width:18px;height:18px}
.say{font-size:11.5px;font-weight:700;color:var(--soluk)}
.ogun ul{list-style:none;margin:0;padding:0}
.ogun li{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--cizgi);font-weight:600;font-size:15px}
.ogun li:first-child{border-top:0}
.ogun li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--renk);flex:none;opacity:.85}
.ogun li.ek{color:var(--soluk);font-size:13.5px}
.ogun li.ek::before{opacity:.4}
.k1{--renk:#e8902e}.k2{--renk:#2f7de1}.k3{--renk:#9b5de5}.k4{--renk:#3f8f5b}
.ara{display:flex;gap:10px;margin-bottom:12px}
.not{font-size:12.5px;color:var(--soluk);text-align:center;margin-top:22px;line-height:1.6}
.gecis{animation:gir .25s ease}
@keyframes gir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.gecis{animation:none}}
</style>
</head>

function kart(k,ad,liste,ek){

function ciz(kaydir){
  const [s,o,a,ak]=V[secili-1];
  const d=new Date(YIL,AY,secili);
  $("tarih").innerHTML=`${secili} Kasım<span>${GU[d.getDay()]}${(bugun.getFullYear()===YIL&&bugun.getMonth()===AY&&bugun.getDate()===secili)?" · Bugün":""}</span>`;

  document.querySelectorAll(".gun").forEach(b=>{const on=+b.dataset.g===secili;b.classList.toggle("aktif",on);b.setAttribute("aria-selected",on);if(on&&kaydir)b.scrollIntoView({inline:"center",block:"nearest",behavior:kaydir==="ani"?"auto":"smooth"})});
  $("geri").disabled=secili===1;$("ileri").disabled=secili===V.length;
}
$("seridi").innerHTML=V.map((_,i)=>{const g=i+1,d=new Date(YIL,AY,g);const bu=bugun.getFullYear()===YIL&&bugun.getMonth()===AY&&bugun.getDate()===g;return `<button class="gun${bu?" bugun":""}" role="tab" data-g="${g}"><small>${bu?"Bugün":GK[d.getDay()]}</small><b>${g}</b></button>`}).join("");
